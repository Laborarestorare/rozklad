
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Домашнє завдання</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #000000;
    --panel: #0b0b0b;
    --column: #080808;
    --card: #111111;
    --inner: #191919;
    --text: #ededed;
    --muted: #858585;
    --line: #242424;

    --task-accent: #927052;
    --event-accent: #687f91;
    --neutral-accent: #aaaaaa;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1050px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background: var(--panel);
    border: 1px solid #1b1b1b;
    border-radius: 17px;
    padding: 23px 24px;
    margin-bottom: 18px;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -0.5px;
}

#today {
    color: var(--muted);
    font-size: 14px;
}

.schedule-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 15px;
    border: 1px solid #303030;
    border-radius: 9px;
    background: #050505;
    color: #e5e5e5;
    text-decoration: none;
    white-space: nowrap;
    font-size: 13px;
    transition: .18s ease;
}

.schedule-button:hover {
    border-color: #555;
    background: #101010;
    color: #fff;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 18px;
}

.summary-card {
    min-width: 0;
    background: var(--panel);
    border: 1px solid #1b1b1b;
    border-radius: 14px;
    padding: 16px;
}

.summary-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 10px;
}

.summary-date {
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 5px;
    overflow-wrap: anywhere;
}

.summary-name {
    color: #999;
    font-size: 13px;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.summary-card.priority {
    border-color: #303030;
}

.summary-card.priority .summary-date {
    color: #dedede;
}

.section {
    background: var(--panel);
    border: 1px solid #1b1b1b;
    border-radius: 17px;
    padding: 20px;
    margin-bottom: 18px;
}

.section h2 {
    margin: 0 0 16px;
    font-size: 19px;
    font-weight: 600;
}

.columns {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.column {
    min-width: 0;
    background: var(--column);
    border: 1px solid #202020;
    border-radius: 13px;
    padding: 15px;
}

.column-heading {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 600;
}

.column-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
}

.task-dot {
    background: var(--task-accent);
}

.event-dot {
    background: var(--event-accent);
}

.upcoming-item {
    background: var(--card);
    border: 1px solid #242424;
    border-left: 3px solid var(--task-accent);
    border-radius: 10px;
    padding: 13px 14px;
    margin-bottom: 9px;
}

.upcoming-item:last-child {
    margin-bottom: 0;
}

.upcoming-item.event-upcoming {
    border-left-color: var(--event-accent);
}

.upcoming-item.important-upcoming {
    border-left-color: var(--neutral-accent);
}

.upcoming-label {
    color: #a18a75;
    font-size: 12px;
    margin-bottom: 6px;
}

.upcoming-label.event-upcoming {
    color: #879baa;
}

.upcoming-label.important-upcoming {
    color: #bcbcbc;
}

.upcoming-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 6px;
    overflow-wrap: anywhere;
}

.upcoming-info {
    color: #999;
    font-size: 13px;
    line-height: 1.45;
}

.upcoming-description {
    color: #bdbdbd;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 8px;
    white-space: pre-line;
}

.upcoming-extra {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 9px;
}

.upcoming-extra span {
    background: var(--inner);
    border: 1px solid #292929;
    border-radius: 7px;
    padding: 5px 8px;
    color: #aaa;
    font-size: 12px;
}

.upcoming-link {
    display: inline-block;
    margin: 8px 10px 0 0;
    color: #91a5b5;
    text-decoration: none;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.upcoming-link:hover {
    color: #c2d0da;
    text-decoration: underline;
}

.empty {
    color: #707070;
    text-align: center;
    padding: 18px 8px;
    font-size: 13px;
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.calendar-header button {
    width: 36px;
    height: 36px;
    border: 1px solid #292929;
    background: #111;
    color: #dedede;
    border-radius: 9px;
    cursor: pointer;
    font-size: 19px;
    transition: .18s ease;
}

.calendar-header button:hover {
    background: #1c1c1c;
    border-color: #444;
}

#monthTitle {
    font-size: 18px;
    font-weight: 600;
}

.calendar-weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}

.calendar-weekdays {
    margin-bottom: 6px;
}

.weekday {
    text-align: center;
    color: #777;
    font-size: 12px;
    padding: 6px 0;
}

.day {
    min-height: 72px;
    background: #101010;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 8px;
    cursor: pointer;
    position: relative;
    transition: background .15s ease;
}

.day:hover {
    background: #191919;
}

.day.empty {
    background: transparent;
    cursor: default;
}

.day-number {
    font-size: 14px;
    color: #dedede;
}

.day.today {
    border-color: #555;
}

.day.selected {
    background: #202020;
    border-color: #777;
}

.day-markers {
    display: flex;
    gap: 5px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.task-marker {
    color: var(--task-accent);
    font-size: 15px;
    line-height: 1;
}

.event-marker {
    color: var(--event-accent);
    font-size: 17px;
    line-height: 1;
    font-weight: bold;
}

.calendar-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 15px;
    color: #888;
    font-size: 12px;
}

.legend-task {
    color: var(--task-accent);
    font-size: 16px;
}

.legend-event {
    color: var(--event-accent);
    font-size: 16px;
    font-weight: bold;
}

.day-details {
    margin-top: 18px;
}

.day-details-title {
    color: #999;
    font-size: 13px;
    margin-bottom: 10px;
}

.calendar-item {
    background: var(--card);
    border: 1px solid #242424;
    border-left: 3px solid var(--task-accent);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 9px;
}

.calendar-item:last-child {
    margin-bottom: 0;
}

.calendar-item.event-item {
    border-left-color: var(--event-accent);
}

.item-label {
    font-size: 12px;
    color: #a18a75;
    margin-bottom: 6px;
}

.item-label.event-type {
    color: #879baa;
}

.item-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
    overflow-wrap: anywhere;
}

.item-description {
    color: #bdbdbd;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 9px;
    white-space: pre-line;
}

.item-info {
    color: #929292;
    font-size: 12px;
    line-height: 1.5;
    margin-top: 5px;
}

.material {
    display: inline-block;
    margin-top: 8px;
    color: #91a5b5;
    text-decoration: none;
}

.material:hover {
    text-decoration: underline;
}

@media (max-width: 700px) {
    .container {
        padding: 12px;
    }

    .summary-grid {
        grid-template-columns: 1fr;
        gap: 9px;
    }

    .summary-card {
        padding: 14px;
    }

    .columns {
        grid-template-columns: 1fr;
    }

    .header,
    .section {
        border-radius: 14px;
        padding: 16px;
    }

    .header h1 {
        font-size: 23px;
    }

    .header-top {
        align-items: flex-start;
    }

    .calendar-weekdays,
    .calendar-grid {
        gap: 4px;
    }

    .day {
        min-height: 58px;
        padding: 6px;
    }

    .day-markers {
        margin-top: 7px;
    }

    .calendar-legend {
        gap: 12px;
    }
}

@media (max-width: 370px) {
    .header-top {
        flex-direction: column;
    }

    .schedule-button {
        align-self: flex-start;
    }

    .day {
        min-height: 49px;
        padding: 5px;
    }

    .day-number {
        font-size: 12px;
    }
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <div class="header-top">
            <div>
                <h1>Домашнє завдання</h1>
                <div id="today"></div>
            </div>

            <a class="schedule-button" href="index.html">
                Відкрити розклад →
            </a>
        </div>
    </div>

    <div class="summary-grid">
        <div class="summary-card">
            <div class="summary-label">Найближчий дедлайн</div>
            <div class="summary-date" id="deadlineSummary">—</div>
            <div class="summary-name" id="deadlineSub">Немає майбутніх дедлайнів</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">Наступна подія</div>
            <div class="summary-date" id="eventSummary">—</div>
            <div class="summary-name" id="eventSub">Немає запланованих подій</div>
        </div>

        <div class="summary-card priority">
            <div class="summary-label">Найближче важливе</div>
            <div class="summary-date" id="prioritySummary">—</div>
            <div class="summary-name" id="prioritySub">Наразі важливих дат немає</div>
        </div>
    </div>

    <div class="section">
        <h2>Найближче за планом</h2>

        <div class="columns">
            <div class="column">
                <div class="column-heading">
                    <span class="column-dot task-dot"></span>
                    Домашні завдання
                </div>
                <div id="tasksList"></div>
            </div>

            <div class="column">
                <div class="column-heading">
                    <span class="column-dot event-dot"></span>
                    Навчальні події
                </div>
                <div id="eventsList"></div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)" aria-label="Попередній місяць">‹</button>
            <div id="monthTitle"></div>
            <button onclick="changeMonth(1)" aria-label="Наступний місяць">›</button>
        </div>

        <div class="calendar-weekdays">
            <div class="weekday">Пн</div>
            <div class="weekday">Вт</div>
            <div class="weekday">Ср</div>
            <div class="weekday">Чт</div>
            <div class="weekday">Пт</div>
            <div class="weekday">Сб</div>
            <div class="weekday">Нд</div>
        </div>

        <div id="calendar" class="calendar-grid"></div>

        <div class="calendar-legend">
            <span><span class="legend-task">●</span> Домашнє завдання</span>
            <span><span class="legend-event">*</span> Подія</span>
        </div>

        <div id="dayDetails" class="day-details"></div>
    </div>

</div>

<script>
const SUPABASE_URL = "https://jnhoomjnsixcyhacqmgy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5LLHZS7S1FD3lHlZM_ox2g_Ggv8wY32";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let tasks = [];
let events = [];

const today = new Date();

let calendarDate = new Date(
    today.getFullYear(),
    today.getMonth(),
    1
);

let selectedDate = formatDateKey(today);

const monthNames = [
    "Січень", "Лютий", "Березень", "Квітень",
    "Травень", "Червень", "Липень", "Серпень",
    "Вересень", "Жовтень", "Листопад", "Грудень"
];

function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatDateKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function formatDateOnly(dateString) {
    if (!dateString) return "";

    const parts = String(dateString).split("-");

    if (parts.length !== 3) return String(dateString);

    return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function formatDateTime(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return String(value);

    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = date.getFullYear();
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");

    return `${day}.${month}.${year}, ${hours}:${minutes}`;
}

function formatTime(value) {
    if (!value) return "";

    const match = String(value).match(/(\d{2}):(\d{2})/);

    return match ? `${match[1]}:${match[2]}` : String(value);
}

function showCurrentDate() {
    const text = today.toLocaleDateString("uk-UA", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("today").textContent =
        text.charAt(0).toUpperCase() + text.slice(1);
}

async function loadTasks() {
    const { data, error } = await supabaseClient
        .from("tasks")
        .select(`
            *,
            subjects (
                name
            )
        `)
        .order("deadline", {
            ascending: true,
            nullsFirst: false
        });

    if (error) {
        console.error("Помилка завантаження завдань:", error);
        document.getElementById("tasksList").innerHTML =
            `<div class="empty">Не вдалося завантажити завдання.</div>`;
        return;
    }

    tasks = data || [];

    renderTasks();
    renderSummaryCards();
    renderCalendar();
    renderSelectedDay();
}

async function loadEvents() {
    const { data, error } = await supabaseClient
        .from("events")
        .select(`
            *,
            subjects (
                name
            )
        `)
        .order("start_at", {
            ascending: true
        });

    if (error) {
        console.error("Помилка завантаження подій:", error);
        events = [];
    } else {
        events = data || [];
    }

    renderEvents();
    renderSummaryCards();
    renderCalendar();
    renderSelectedDay();
}

function getUpcomingTaskDate(task) {
    if (!task.deadline) return null;

    const deadline = new Date(`${task.deadline}T23:59:59`);

    if (Number.isNaN(deadline.getTime())) return null;

    if (task.start_time) {
        const match = String(task.start_time).match(/(\d{2}):(\d{2})/);

        if (match) {
            deadline.setHours(
                Number(match[1]),
                Number(match[2]),
                0,
                0
            );
        }
    }

    return deadline;
}

function getUpcomingEventDate(event) {
    if (!event.start_at) return null;

    const date = new Date(event.start_at);

    return Number.isNaN(date.getTime()) ? null : date;
}

function getEventDate(event) {
    const date = getUpcomingEventDate(event);
    return date ? formatDateKey(date) : null;
}

function getTaskEndDate(task) {
    const date = getUpcomingTaskDate(task);
    if (!date) return null;

    if (task.end_time && task.deadline) {
        const match = String(task.end_time).match(/(\d{2}):(\d{2})/);

        if (match) {
            date.setHours(
                Number(match[1]),
                Number(match[2]),
                0,
                0
            );
        }
    }

    return date;
}

function getRelativeDate(date) {
    if (!date) return "—";

    const target = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

    const base = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    );

    const diff = Math.round((target - base) / 86400000);

    if (diff === 0) return "Сьогодні";
    if (diff === 1) return "Завтра";

    return date.toLocaleDateString("uk-UA", {
        day: "numeric",
        month: "long"
    });
}

function parseMaterials(value) {
    if (!value) return [];

    return String(value)
        .split(/\r?\n/)
        .map(item => item.trim())
        .filter(Boolean)
        .map(item => {
            if (/^https?:\/\//i.test(item)) {
                try {
                    const url = new URL(item);

                    if (url.protocol === "http:" || url.protocol === "https:") {
                        return {
                            name: "Матеріал",
                            url: item
                        };
                    }
                } catch (error) {
                    return null;
                }
            }

            const slashIndex = item.indexOf("/");

            if (slashIndex > 0) {
                const name = item.slice(0, slashIndex).trim();
                const urlValue = item.slice(slashIndex + 1).trim();

                try {
                    const url = new URL(urlValue);

                    if (
                        name &&
                        (url.protocol === "http:" || url.protocol === "https:")
                    ) {
                        return {
                            name,
                            url: urlValue
                        };
                    }
                } catch (error) {
                    return null;
                }
            }

            return null;
        })
        .filter(Boolean);
}

function renderMaterialLinks(material) {
    return parseMaterials(material).map(link => `
        <a class="upcoming-link"
           href="${escapeHtml(link.url)}"
           target="_blank"
           rel="noopener noreferrer">
            ${escapeHtml(link.name)}
        </a>
    `).join("");
}

function getEventType(event) {
    const savedType = String(event.event_type || "").trim();

    if (savedType) return savedType;

    const title = String(event.title || "").toLowerCase();

    if (title.includes("семінар")) return "Семінар";
    if (title.includes("іспит") || title.includes("екзамен")) return "Іспит";
    if (title.includes("залік")) return "Залік";
    if (title.includes("консульта")) return "Консультація";
    if (title.includes("лекці")) return "Лекція";

    return "Подія";
}

function isExamEvent(event) {
    const type = getEventType(event).toLowerCase();
    const title = String(event.title || "").toLowerCase();

    return type.includes("залік") ||
           type.includes("іспит") ||
           type.includes("екзамен") ||
           title.includes("залік") ||
           title.includes("іспит") ||
           title.includes("екзамен");
}

function renderSummaryCards() {
    const now = new Date();

    const upcomingTasks = tasks
        .filter(task => task.deadline)
        .map(task => ({
            data: task,
            date: getTaskEndDate(task)
        }))
        .filter(item => item.date && item.date >= now)
        .sort((a, b) => a.date - b.date);

    const upcomingEvents = events
        .map(event => ({
            data: event,
            date: getUpcomingEventDate(event)
        }))
        .filter(item => item.date && item.date >= now)
        .sort((a, b) => a.date - b.date);

    const deadline = upcomingTasks[0];

    document.getElementById("deadlineSummary").textContent =
        deadline ? getRelativeDate(deadline.date) : "—";

    document.getElementById("deadlineSub").textContent =
        deadline
            ? (deadline.data.title || "Домашнє завдання")
            : "Немає майбутніх дедлайнів";

    const nextEvent = upcomingEvents[0];

    document.getElementById("eventSummary").textContent =
        nextEvent ? getRelativeDate(nextEvent.date) : "—";

    document.getElementById("eventSub").textContent =
        nextEvent
            ? `${getEventType(nextEvent.data)} · ${nextEvent.data.title || "Подія"}`
            : "Немає запланованих подій";

    const nearestExam = upcomingEvents.find(item =>
        isExamEvent(item.data)
    );

    let priority = null;
    let priorityLabel = "";

    if (nearestExam) {
        priority = nearestExam;
        priorityLabel = getEventType(nearestExam.data);
    } else if (deadline) {
        priority = deadline;
        priorityLabel = "Домашнє завдання";
    } else if (nextEvent) {
        priority = nextEvent;
        priorityLabel = getEventType(nextEvent.data);
    }

    document.getElementById("prioritySummary").textContent =
        priority ? getRelativeDate(priority.date) : "—";

    document.getElementById("prioritySub").textContent =
        priority
            ? `${priorityLabel} · ${priority.data.title || "Без назви"}`
            : "Наразі важливих дат немає";
}

function renderTasks() {
    const container = document.getElementById("tasksList");
    const now = new Date();

    const upcomingTasks = tasks
        .map(task => ({
            data: task,
            date: getTaskEndDate(task)
        }))
        .filter(item => {
            if (!item.date) return true;
            return item.date >= now;
        })
        .sort((a, b) => {
            if (!a.date && !b.date) return 0;
            if (!a.date) return 1;
            if (!b.date) return -1;
            return a.date - b.date;
        })
        .slice(0, 5);

    if (!upcomingTasks.length) {
        container.innerHTML =
            `<div class="empty">Найближчих домашніх завдань немає.</div>`;
        return;
    }

    container.innerHTML = upcomingTasks.map(item => {
        const task = item.data;
        const subject = task.subjects?.name || "";

        let info = "";

        if (task.deadline) {
            info += `Дедлайн: ${escapeHtml(formatDateOnly(task.deadline))}`;
        }

        if (task.start_time) {
            const start = formatTime(task.start_time);
            const end = task.end_time ? formatTime(task.end_time) : "";

            if (info) info += " · ";

            info += `Час: ${escapeHtml(start)}${end ? "–" + escapeHtml(end) : ""}`;
        }

        const extra = [];

        if (task.points !== null && task.points !== undefined && task.points !== "") {
            extra.push(`<span>Бали: ${escapeHtml(task.points)}</span>`);
        }

        if (task.duration_minutes) {
            extra.push(`<span>${escapeHtml(task.duration_minutes)} хв</span>`);
        }

        return `
            <div class="upcoming-item">
                <div class="upcoming-label">
                    ${subject ? escapeHtml(subject) : "Домашнє завдання"}
                </div>

                <div class="upcoming-title">
                    ${escapeHtml(task.title || "Завдання")}
                </div>

                ${info ? `
                    <div class="upcoming-info">${info}</div>
                ` : ""}

                ${task.description ? `
                    <div class="upcoming-description">
                        ${escapeHtml(task.description)}
                    </div>
                ` : ""}

                ${extra.length ? `
                    <div class="upcoming-extra">${extra.join("")}</div>
                ` : ""}

                ${task.material ? renderMaterialLinks(task.material) : ""}
            </div>
        `;
    }).join("");
}

function renderEvents() {
    const container = document.getElementById("eventsList");
    const now = new Date();

    const upcomingEvents = events
        .map(event => ({
            data: event,
            date: getUpcomingEventDate(event)
        }))
        .filter(item => item.date && item.date >= now)
        .sort((a, b) => a.date - b.date)
        .slice(0, 5);

    if (!upcomingEvents.length) {
        container.innerHTML =
            `<div class="empty">Найближчих навчальних подій немає.</div>`;
        return;
    }

    container.innerHTML = upcomingEvents.map(item => {
        const event = item.data;
        const subject = event.subjects?.name || "";
        const type = getEventType(event);

        const start = getUpcomingEventDate(event);
        let time = "";

        if (start) {
            const day = String(start.getDate()).padStart(2, "0");
            const month = String(start.getMonth() + 1).padStart(2, "0");
            const hours = String(start.getHours()).padStart(2, "0");
            const minutes = String(start.getMinutes()).padStart(2, "0");

            time = `${day}.${month} · ${hours}:${minutes}`;

            if (event.end_at) {
                const end = new Date(event.end_at);

                if (!Number.isNaN(end.getTime())) {
                    time += `–${String(end.getHours()).padStart(2, "0")}:${String(end.getMinutes()).padStart(2, "0")}`;
                }
            }
        }

        return `
            <div class="upcoming-item event-upcoming">
                <div class="upcoming-label event-upcoming">
                    * ${escapeHtml(type)}
                    ${subject ? ` · ${escapeHtml(subject)}` : ""}
                </div>

                <div class="upcoming-title">
                    ${escapeHtml(event.title || "Подія")}
                </div>

                ${time ? `
                    <div class="upcoming-info">${escapeHtml(time)}</div>
                ` : ""}

                ${event.description ? `
                    <div class="upcoming-description">
                        ${escapeHtml(event.description)}
                    </div>
                ` : ""}

                ${event.info ? `
                    <div class="upcoming-extra">
                        <span>${escapeHtml(event.info)}</span>
                    </div>
                ` : ""}

                ${event.link ? renderMaterialLinks(event.link) : ""}
            </div>
        `;
    }).join("");
}

function getItemsForDate(dateKey) {
    const dateTasks = tasks.filter(task =>
        task.deadline === dateKey
    );

    const dateEvents = events.filter(event =>
        getEventDate(event) === dateKey
    );

    return {
        tasks: dateTasks,
        events: dateEvents
    };
}

function renderCalendar() {
    const calendar = document.getElementById("calendar");
    const monthTitle = document.getElementById("monthTitle");

    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    monthTitle.textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1);

    let startDay = firstDay.getDay();

    if (startDay === 0) startDay = 7;

    startDay -= 1;

    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = "";

    for (let i = 0; i < startDay; i++) {
        html += `<div class="day empty"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateKey = formatDateKey(date);
        const items = getItemsForDate(dateKey);

        const isToday = dateKey === formatDateKey(today);
        const isSelected = dateKey === selectedDate;

        html += `
            <div
                class="day ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}"
                onclick="selectDate('${dateKey}')"
            >
                <div class="day-number">${day}</div>

                ${items.tasks.length || items.events.length ? `
                    <div class="day-markers">
                        ${items.tasks.length
                            ? `<span class="task-marker">●</span>`
                            : ""}

                        ${items.events.length
                            ? `<span class="event-marker">*</span>`
                            : ""}
                    </div>
                ` : ""}
            </div>
        `;
    }

    calendar.innerHTML = html;
}

function selectDate(dateKey) {
    selectedDate = dateKey;

    renderCalendar();
    renderSelectedDay();
}

function renderSelectedDay() {
    const container = document.getElementById("dayDetails");

    if (!selectedDate) {
        container.innerHTML = "";
        return;
    }

    const items = getItemsForDate(selectedDate);

    if (!items.tasks.length && !items.events.length) {
        container.innerHTML = "";
        return;
    }

    let html = `
        <div class="day-details-title">
            ${escapeHtml(formatDateOnly(selectedDate))}
        </div>
    `;

    items.tasks.forEach(task => {
        const subject = task.subjects?.name || "";

        let info = "";

        if (task.start_time) {
            const start = formatTime(task.start_time);
            const end = task.end_time ? formatTime(task.end_time) : "";

            info += `
                <div class="item-info">
                    Час виконання: ${escapeHtml(start)}${end ? "–" + escapeHtml(end) : ""}
                </div>
            `;
        }

        if (task.points !== null && task.points !== undefined && task.points !== "") {
            info += `
                <div class="item-info">
                    Бали: ${escapeHtml(task.points)}
                </div>
            `;
        }

        if (task.material) {
            info += renderMaterialLinks(task.material);
        }

        html += `
            <div class="calendar-item task-item">
                <div class="item-label">
                    ${subject ? escapeHtml(subject) : "Домашнє завдання"}
                </div>

                <div class="item-title">
                    ${escapeHtml(task.title || "Завдання")}
                </div>

                ${task.description ? `
                    <div class="item-description">
                        ${escapeHtml(task.description)}
                    </div>
                ` : ""}

                ${task.deadline ? `
                    <div class="item-info">
                        Дедлайн: ${escapeHtml(formatDateOnly(task.deadline))}
                    </div>
                ` : ""}

                ${info}
            </div>
        `;
    });

    items.events.forEach(event => {
        const type = getEventType(event);
        const subject = event.subjects?.name || "";

        let time = "";

        if (event.start_at) {
            time = formatDateTime(event.start_at);

            if (event.end_at) {
                const endDate = new Date(event.end_at);

                if (!Number.isNaN(endDate.getTime())) {
                    time += `–${String(endDate.getHours()).padStart(2, "0")}:${String(endDate.getMinutes()).padStart(2, "0")}`;
                }
            }
        }

        html += `
            <div class="calendar-item event-item">
                <div class="item-label event-type">
                    * ${escapeHtml(type)}
                    ${subject ? ` · ${escapeHtml(subject)}` : ""}
                </div>

                <div class="item-title">
                    ${escapeHtml(event.title || "Подія")}
                </div>

                ${event.description ? `
                    <div class="item-description">
                        ${escapeHtml(event.description)}
                    </div>
                ` : ""}

                ${time ? `
                    <div class="item-info">
                        Час: ${escapeHtml(time)}
                    </div>
                ` : ""}

                ${event.info ? `
                    <div class="item-info">
                        ${escapeHtml(event.info)}
                    </div>
                ` : ""}

                ${event.link ? renderMaterialLinks(event.link) : ""}
            </div>
        `;
    });

    container.innerHTML = html;
}

function changeMonth(offset) {
    calendarDate = new Date(
        calendarDate.getFullYear(),
        calendarDate.getMonth() + offset,
        1
    );

    renderCalendar();
}

showCurrentDate();
renderCalendar();

loadTasks();
loadEvents();

setInterval(() => {
    renderTasks();
    renderEvents();
    renderSummaryCards();
}, 60000);
</script>
</body>
</html>
