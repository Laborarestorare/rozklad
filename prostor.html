<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Домашнє завдання</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --black: #000000;
    --surface: #050505;
    --surface-1: #080808;
    --surface-2: #0c0c0c;
    --surface-3: #101010;
    --surface-4: #151515;

    --white: #f4f4f4;
    --white-soft: #d9d9d9;
    --gray-1: #b7b7b7;
    --gray-2: #999999;
    --gray-3: #777777;
    --gray-4: #5e5e5e;

    --border: rgba(255,255,255,.105);
    --border-soft: rgba(255,255,255,.065);
    --border-medium: rgba(255,255,255,.15);

    --blue: #4da3ff;
    --blue-soft: rgba(77,163,255,.12);
    --blue-border: rgba(77,163,255,.32);

    --shadow: 0 14px 45px rgba(0,0,0,.38);
    --shadow-soft: 0 8px 28px rgba(0,0,0,.28);
}

html {
    background: var(--black);
}

body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.header,
.section {
    background: linear-gradient(
        145deg,
        #090909 0%,
        #050505 55%,
        #080808 100%
    );
    border: 1px solid var(--border);
    box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.025);
}

.header {
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 20px;
}

.header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 15px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 28px;
    letter-spacing: -.4px;
}

#today {
    color: var(--gray-2);
    font-size: 15px;
}

.schedule-button {
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 9px 13px;
    background: #0d0d0d;
    color: var(--gray-1);
    cursor: pointer;
    font-size: 13px;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    transition:
        background .18s ease,
        color .18s ease,
        border-color .18s ease;
}

.schedule-button:hover {
    background: #141414;
    color: var(--white);
    border-color: var(--border-medium);
}

.section {
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
}

.section h2 {
    margin: 0 0 16px;
    font-size: 21px;
    letter-spacing: -.25px;
}

.task {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 15px;
    padding: 17px;
    margin-bottom: 12px;
    box-shadow:
        0 7px 24px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.018);
}

.task:last-child {
    margin-bottom: 0;
}

.task-subject {
    color: var(--gray-2);
    font-size: 14px;
    margin-bottom: 6px;
}

.task-title {
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 7px;
}

.task-description {
    color: var(--white-soft);
    line-height: 1.5;
    margin-bottom: 12px;
}

.task-info {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.info {
    background: #111111;
    border: 1px solid var(--border-soft);
    border-radius: 9px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--white-soft);
}

.material {
    display: inline-block;
    margin-top: 12px;
    color: #8ab4f8;
    text-decoration: none;
}

.material:hover {
    text-decoration: underline;
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.calendar-header button {
    border: 1px solid var(--border);
    background: #0b0b0b;
    color: var(--white-soft);
    width: 38px;
    height: 38px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    transition:
        background .18s ease,
        border-color .18s ease,
        color .18s ease;
}

.calendar-header button:hover {
    background: #151515;
    border-color: var(--border-medium);
    color: var(--white);
}

#monthTitle {
    font-size: 19px;
    font-weight: 600;
    color: var(--white-soft);
}

.calendar-weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}

.calendar-weekdays {
    margin-bottom: 6px;
}

.weekday {
    text-align: center;
    color: var(--gray-3);
    font-size: 12px;
    padding: 6px 0;
}

.day {
    min-height: 72px;
    background: #080808;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    position: relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.018);
    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
}

.day:hover {
    background: #101010;
    border-color: var(--border);
}

.day.empty {
    background: transparent;
    border-color: transparent;
    cursor: default;
    box-shadow: none;
}

.day-number {
    font-size: 14px;
    color: var(--white-soft);
}

.day.today {
    outline: 1px solid rgba(255,255,255,.25);
    outline-offset: -1px;
    background: #0c0c0c;
}

.day.selected {
    background: #111111;
    outline: 1px solid rgba(255,255,255,.3);
    outline-offset: -1px;
    border-color: rgba(255,255,255,.16);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 5px 18px rgba(0,0,0,.25);
}

.day-markers {
    display: flex;
    gap: 5px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.task-marker {
    color: #d8d8d8;
    font-size: 18px;
    line-height: 1;
}

.event-marker {
    color: var(--blue);
    font-size: 20px;
    line-height: 1;
    font-weight: bold;
}

.calendar-legend {
    display: flex;
    gap: 18px;
    margin-top: 15px;
    color: var(--gray-2);
    font-size: 13px;
    padding: 11px 13px;
    background: #060606;
    border: 1px solid var(--border-soft);
    border-radius: 11px;
}

.legend-task {
    color: #d8d8d8;
    font-size: 17px;
}

.legend-event {
    color: var(--blue);
    font-size: 19px;
    font-weight: bold;
}

.day-details {
    margin-top: 18px;
    padding-top: 2px;
}

.day-details-title {
    color: var(--gray-2);
    font-size: 14px;
    margin-bottom: 10px;
    padding-left: 2px;
}

.calendar-item {
    background: linear-gradient(
        145deg,
        #0d0d0d,
        #080808
    );
    border: 1px solid var(--border-soft);
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 9px;
    box-shadow:
        0 7px 24px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.018);
}

.calendar-item:last-child {
    margin-bottom: 0;
}

.calendar-item.task-item {
    border-left: 3px solid rgba(255,255,255,.28);
}

.calendar-item.event-item {
    border-left: 3px solid var(--blue);
    background:
        linear-gradient(
            145deg,
            rgba(77,163,255,.035),
            #080808 65%
        );
}

.item-label {
    font-size: 13px;
    color: var(--gray-2);
    margin-bottom: 5px;
}

.item-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--white);
}

.item-description {
    color: #c7c7c7;
    line-height: 1.45;
    margin-bottom: 9px;
}

.item-info {
    color: var(--gray-2);
    font-size: 13px;
    margin-top: 5px;
}

.event-type {
    color: var(--blue);
}

.empty {
    color: var(--gray-3);
    text-align: center;
    padding: 10px 0;
}

.upcoming-item {
    position: relative;
    background: linear-gradient(
        145deg,
        #0d0d0d 0%,
        #080808 100%
    );
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 14px 15px;
    margin-bottom: 9px;
    border-left: 3px solid rgba(255,255,255,.25);
    box-shadow:
        0 7px 24px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.018);
    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
}

.upcoming-item:hover {
    background: #101010;
    border-color: var(--border);
}

.upcoming-item:last-child {
    margin-bottom: 0;
}

.upcoming-item.event-upcoming {
    border-left-color: var(--blue);
    background:
        linear-gradient(
            145deg,
            rgba(77,163,255,.045),
            #080808 68%
        );
}

.upcoming-label {
    color: var(--gray-2);
    font-size: 12px;
    margin-bottom: 5px;
    letter-spacing: .1px;
}

.upcoming-label.event-upcoming {
    color: var(--blue);
}

.upcoming-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--white);
}

.upcoming-info {
    color: #a7a7a7;
    font-size: 13px;
    line-height: 1.45;
}

.upcoming-description {
    color: #c5c5c5;
    font-size: 13px;
    line-height: 1.45;
    margin-top: 7px;
}

.upcoming-extra {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}

.upcoming-extra span {
    background: #111111;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 5px 8px;
    color: #b7b7b7;
    font-size: 12px;
}

.upcoming-link {
    display: inline-block;
    margin-top: 8px;
    color: #8ab4f8;
    text-decoration: none;
    font-size: 13px;
}

.upcoming-link:hover {
    text-decoration: underline;
}

@media (max-width: 600px) {
    .container {
        padding: 12px;
    }

    .header,
    .section {
        border-radius: 16px;
        padding: 16px;
    }

    .header-top {
        align-items: flex-start;
    }

    .calendar-weekdays,
    .calendar-grid {
        gap: 4px;
    }

    .day {
        min-height: 58px;
        padding: 6px;
        border-radius: 10px;
    }

    .day-markers {
        margin-top: 7px;
    }

    .calendar-legend {
        gap: 12px;
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="header-top">
            <div>
                <h1>Домашнє завдання</h1>
                <div id="today"></div>
            </div>

            <a class="schedule-button" href="index.html">Розклад</a>
        </div>
    </div>

    <div class="section">
        <h2>Найближчі завдання</h2>
        <div id="tasksList"></div>
    </div>

    <div class="section">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">‹</button>
            <div id="monthTitle"></div>
            <button onclick="changeMonth(1)">›</button>
        </div>

        <div class="calendar-weekdays">
            <div class="weekday">Пн</div>
            <div class="weekday">Вт</div>
            <div class="weekday">Ср</div>
            <div class="weekday">Чт</div>
            <div class="weekday">Пт</div>
            <div class="weekday">Сб</div>
            <div class="weekday">Нд</div>
        </div>

        <div id="calendar" class="calendar-grid"></div>

        <div class="calendar-legend">
            <span><span class="legend-task">●</span> Домашнє завдання</span>
            <span><span class="legend-event">*</span> Подія</span>
        </div>

        <div id="dayDetails" class="day-details"></div>
    </div>

</div>

<script>
const SUPABASE_URL = "https://jnhoomjnsixcyhacqmgy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5LLHZS7S1FD3lHlZM_ox2g_Ggv8wY32";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let tasks = [];
let events = [];

const today = new Date();

let calendarDate = new Date(
    today.getFullYear(),
    today.getMonth(),
    1
);

let selectedDate = formatDateKey(today);

const monthNames = [
    "Січень",
    "Лютий",
    "Березень",
    "Квітень",
    "Травень",
    "Червень",
    "Липень",
    "Серпень",
    "Вересень",
    "Жовтень",
    "Листопад",
    "Грудень"
];

function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatDateKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function formatDateOnly(dateString) {
    if (!dateString) return "";

    const parts = String(dateString).split("-");

    if (parts.length !== 3) {
        return String(dateString);
    }

    return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function formatDateTime(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = date.getFullYear();
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");

    return `${day}.${month}.${year}, ${hours}:${minutes}`;
}

function formatTime(value) {
    if (!value) return "";

    const match = String(value).match(/(\d{2}):(\d{2})/);

    if (!match) {
        return String(value);
    }

    return `${match[1]}:${match[2]}`;
}

function showCurrentDate() {
    const text = today.toLocaleDateString("uk-UA", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("today").textContent =
        text.charAt(0).toUpperCase() + text.slice(1);
}

async function loadTasks() {
    const { data, error } = await supabaseClient
        .from("tasks")
        .select(`
            *,
            subjects (
                name
            )
        `)
        .order("deadline", {
            ascending: true,
            nullsFirst: false
        });

    if (error) {
        console.error("Помилка завантаження завдань:", error);
        document.getElementById("tasksList").innerHTML =
            `<div class="empty">Не вдалося завантажити завдання.</div>`;
        return;
    }

    tasks = data || [];

    renderTasks();
    renderCalendar();
    renderSelectedDay();
}

async function loadEvents() {
    const { data, error } = await supabaseClient
        .from("events")
        .select(`
            *,
            subjects (
                name
            )
        `)
        .order("start_at", {
            ascending: true
        });

    if (error) {
        console.error("Помилка завантаження подій:", error);
        events = [];
    } else {
        events = data || [];
    }

    renderCalendar();
    renderSelectedDay();
    renderTasks();
}

function getUpcomingTaskDate(task) {
    if (!task.deadline) {
        return null;
    }

    const deadline = new Date(`${task.deadline}T23:59:59`);

    if (task.start_time) {
        const match = String(task.start_time).match(/(\d{2}):(\d{2})/);

        if (match) {
            deadline.setHours(
                Number(match[1]),
                Number(match[2]),
                0,
                0
            );
        }
    }

    return deadline;
}

function getUpcomingEventDate(event) {
    if (!event.start_at) {
        return null;
    }

    const date = new Date(event.start_at);

    if (Number.isNaN(date.getTime())) {
        return null;
    }

    return date;
}

function parseMaterials(value) {
    if (!value) return [];

    return String(value)
        .split(/\r?\n/)
        .map(item => item.trim())
        .filter(Boolean)
        .map(item => {

            if (item.startsWith("http://") || item.startsWith("https://")) {
                return {
                    name: "Матеріал",
                    url: item
                };
            }

            const slashIndex = item.indexOf("/");

            if (slashIndex > 0) {
                const name = item.slice(0, slashIndex).trim();
                const url = item.slice(slashIndex + 1).trim();

                if (name && (url.startsWith("http://") || url.startsWith("https://"))) {
                    return {
                        name,
                        url
                    };
                }
            }

            return {
                name: "Матеріал",
                url: item
            };
        });
}

function renderMaterialLinks(material) {
    const links = parseMaterials(material);

    if (!links.length) {
        return "";
    }

    return links.map(link => `
        <a class="upcoming-link"
           href="${escapeHtml(link.url)}"
           target="_blank"
           rel="noopener noreferrer">
            ${escapeHtml(link.name)}
        </a>
    `).join("");
}

function renderTasks() {
    const container = document.getElementById("tasksList");
    const now = new Date();

    const upcomingTasks = tasks
        .map(task => ({
            type: "task",
            data: task,
            date: getUpcomingTaskDate(task)
        }))
        .filter(item => {
            if (!item.date) return true;

            const endDate = item.data.end_time
                ? new Date(item.date)
                : item.date;

            if (item.data.end_time && item.data.deadline) {
                const match = String(item.data.end_time).match(/(\d{2}):(\d{2})/);

                if (match) {
                    endDate.setHours(
                        Number(match[1]),
                        Number(match[2]),
                        0,
                        0
                    );
                }
            }

            return endDate >= now;
        });

    const upcomingEvents = events
        .map(event => ({
            type: "event",
            data: event,
            date: getUpcomingEventDate(event)
        }))
        .filter(item => item.date && item.date >= now);

    const upcomingItems = [
        ...upcomingTasks,
        ...upcomingEvents
    ]
        .sort((a, b) => {
            if (!a.date && !b.date) return 0;
            if (!a.date) return 1;
            if (!b.date) return -1;

            return a.date - b.date;
        })
        .slice(0, 5);

    if (!upcomingItems.length) {
        container.innerHTML =
            `<div class="empty">Найближчих завдань немає.</div>`;
        return;
    }

    container.innerHTML = upcomingItems.map(item => {
        if (item.type === "event") {
            const event = item.data;
            const type = getEventType(event);
            const subject = event.subjects?.name || "";

            let time = "";

            if (event.start_at) {
                const start = new Date(event.start_at);

                if (!Number.isNaN(start.getTime())) {
                    const day = String(start.getDate()).padStart(2, "0");
                    const month = String(start.getMonth() + 1).padStart(2, "0");
                    const hours = String(start.getHours()).padStart(2, "0");
                    const minutes = String(start.getMinutes()).padStart(2, "0");

                    time = `${day}.${month} · ${hours}:${minutes}`;

                    if (event.end_at) {
                        const end = new Date(event.end_at);

                        if (!Number.isNaN(end.getTime())) {
                            time += `–${String(end.getHours()).padStart(2, "0")}:${String(end.getMinutes()).padStart(2, "0")}`;
                        }
                    }
                }
            }

            return `
                <div class="upcoming-item event-upcoming">
                    <div class="upcoming-label event-upcoming">
                        * ${escapeHtml(type)}
                        ${subject ? ` · ${escapeHtml(subject)}` : ""}
                    </div>

                    <div class="upcoming-title">
                        ${escapeHtml(event.title || "Подія")}
                    </div>

                    ${
                        time
                        ? `
                            <div class="upcoming-info">
                                ${escapeHtml(time)}
                            </div>
                        `
                        : ""
                    }

                    ${
                        event.description
                        ? `
                            <div class="upcoming-description">
                                ${escapeHtml(event.description)}
                            </div>
                        `
                        : ""
                    }

                    ${
                        event.info
                        ? `
                            <div class="upcoming-extra">
                                <span>ℹ ${escapeHtml(event.info)}</span>
                            </div>
                        `
                        : ""
                    }

                    ${
                        event.link
                        ? renderMaterialLinks(event.link)
                        : ""
                    }
                </div>
            `;
        }

        const task = item.data;
        const subject =
            task.subjects?.name || "";

        let info = "";

        if (task.deadline) {
            info += `Дедлайн: ${escapeHtml(formatDateOnly(task.deadline))}`;
        }

        if (task.start_time) {
            const start = formatTime(task.start_time);
            const end = task.end_time
                ? formatTime(task.end_time)
                : "";

            if (info) info += " · ";

            info += `Час: ${escapeHtml(start)}${end ? "–" + escapeHtml(end) : ""}`;
        }

        const extra = [];

        if (task.points !== null && task.points !== undefined && task.points !== "") {
            extra.push(`<span>Бали: ${escapeHtml(task.points)}</span>`);
        }

        return `
            <div class="upcoming-item">
                <div class="upcoming-label">
                    ${subject ? `● ${escapeHtml(subject)}` : "● Завдання"}
                </div>

                <div class="upcoming-title">
                    ${escapeHtml(task.title || "Завдання")}
                </div>

                ${
                    info
                    ? `
                        <div class="upcoming-info">
                            ${info}
                        </div>
                    `
                    : ""
                }

                ${
                    task.description
                    ? `
                        <div class="upcoming-description">
                            ${escapeHtml(task.description)}
                        </div>
                    `
                    : ""
                }

                ${
                    extra.length
                    ? `
                        <div class="upcoming-extra">
                            ${extra.join("")}
                        </div>
                    `
                    : ""
                }

                ${
                    task.material
                    ? renderMaterialLinks(task.material)
                    : ""
                }
            </div>
        `;
    }).join("");
}

function getEventDate(event) {
    if (!event.start_at) return null;

    const date = new Date(event.start_at);

    if (Number.isNaN(date.getTime())) {
        return null;
    }

    return formatDateKey(date);
}

function getEventType(event) {
    const savedType = String(event.event_type || "").trim();

    if (savedType) {
        return savedType;
    }

    const title = String(event.title || "").toLowerCase();

    if (title.includes("семінар")) return "Семінар";
    if (title.includes("іспит")) return "Іспит";
    if (title.includes("залік")) return "Залік";
    if (title.includes("консульта")) return "Консультація";
    if (title.includes("лекці")) return "Лекція";

    return "Подія";
}

function getItemsForDate(dateKey) {
    const dateTasks = tasks.filter(task =>
        task.deadline === dateKey
    );

    const dateEvents = events.filter(event =>
        getEventDate(event) === dateKey
    );

    return {
        tasks: dateTasks,
        events: dateEvents
    };
}

function renderCalendar() {
    const calendar = document.getElementById("calendar");
    const monthTitle = document.getElementById("monthTitle");

    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    monthTitle.textContent =
        `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1);

    let startDay = firstDay.getDay();

    if (startDay === 0) {
        startDay = 7;
    }

    startDay -= 1;

    const daysInMonth =
        new Date(year, month + 1, 0).getDate();

    let html = "";

    for (let i = 0; i < startDay; i++) {
        html += `<div class="day empty"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateKey = formatDateKey(date);

        const items = getItemsForDate(dateKey);

        const isToday =
            dateKey === formatDateKey(today);

        const isSelected =
            dateKey === selectedDate;

        html += `
            <div
                class="day ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}"
                onclick="selectDate('${dateKey}')"
            >
                <div class="day-number">
                    ${day}
                </div>

                ${
                    items.tasks.length || items.events.length
                    ? `
                        <div class="day-markers">
                            ${
                                items.tasks.length
                                ? `<span class="task-marker">●</span>`
                                : ""
                            }

                            ${
                                items.events.length
                                ? `<span class="event-marker">*</span>`
                                : ""
                            }
                        </div>
                    `
                    : ""
                }
            </div>
        `;
    }

    calendar.innerHTML = html;
}

function selectDate(dateKey) {
    selectedDate = dateKey;

    renderCalendar();
    renderSelectedDay();
}

function renderSelectedDay() {
    const container = document.getElementById("dayDetails");

    if (!selectedDate) {
        container.innerHTML = "";
        return;
    }

    const items = getItemsForDate(selectedDate);

    if (!items.tasks.length && !items.events.length) {
        container.innerHTML = "";
        return;
    }

    let html = `
        <div class="day-details-title">
            ${escapeHtml(formatDateOnly(selectedDate))}
        </div>
    `;

    items.tasks.forEach(task => {
        const subject =
            task.subjects?.name || "";

        let info = "";

        if (task.start_time) {
            const start = formatTime(task.start_time);
            const end = task.end_time
                ? formatTime(task.end_time)
                : "";

            info += `
                <div class="item-info">
                    Час виконання:
                    ${escapeHtml(start)}${end ? "–" + escapeHtml(end) : ""}
                </div>
            `;
        }

        if (task.points !== null && task.points !== undefined) {
            info += `
                <div class="item-info">
                    Бали: ${escapeHtml(task.points)}
                </div>
            `;
        }

        if (task.material) {
            const materialLinks = parseMaterials(task.material);

            info += materialLinks.map(link => `
                <div class="item-info">
                    <a
                        class="material"
                        href="${escapeHtml(link.url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHtml(link.name)}
                    </a>
                </div>
            `).join("");
        }

        html += `
            <div class="calendar-item task-item">
                <div class="item-label">
                    ${subject ? `● ${escapeHtml(subject)}` : "● Завдання"}
                </div>

                <div class="item-title">
                    ${escapeHtml(task.title || "Завдання")}
                </div>

                ${
                    task.description
                    ? `
                        <div class="item-description">
                            ${escapeHtml(task.description)}
                        </div>
                    `
                    : ""
                }

                ${
                    task.deadline
                    ? `
                        <div class="item-info">
                            Дедлайн:
                            ${escapeHtml(formatDateOnly(task.deadline))}
                        </div>
                    `
                    : ""
                }

                ${info}
            </div>
        `;
    });

    items.events.forEach(event => {
        const type = getEventType(event);
        const subject = event.subjects?.name || "";

        let time = "";

        if (event.start_at) {
            time += formatDateTime(event.start_at);

            if (event.end_at) {
                const endDate = new Date(event.end_at);

                if (!Number.isNaN(endDate.getTime())) {
                    time += `–${String(endDate.getHours()).padStart(2, "0")}:${String(endDate.getMinutes()).padStart(2, "0")}`;
                }
            }
        }

        html += `
            <div class="calendar-item event-item">
                <div class="item-label event-type">
                    * ${escapeHtml(type)}
                    ${subject ? ` · ${escapeHtml(subject)}` : ""}
                </div>

                <div class="item-title">
                    ${escapeHtml(event.title || "Подія")}
                </div>

                ${
                    event.description
                    ? `
                        <div class="item-description">
                            ${escapeHtml(event.description)}
                        </div>
                    `
                    : ""
                }

                ${
                    time
                    ? `
                        <div class="item-info">
                            Час: ${escapeHtml(time)}
                        </div>
                    `
                    : ""
                }

                ${
                    event.info
                    ? `
                        <div class="item-info">
                            ℹ ${escapeHtml(event.info)}
                        </div>
                    `
                    : ""
                }

                ${
                    event.link
                    ? renderMaterialLinks(event.link)
                    : ""
                }
            </div>
        `;
    });

    container.innerHTML = html;
}

function changeMonth(offset) {
    calendarDate = new Date(
        calendarDate.getFullYear(),
        calendarDate.getMonth() + offset,
        1
    );

    renderCalendar();
}

showCurrentDate();
loadTasks();
loadEvents();

setInterval(() => {
    renderTasks();
}, 60000);
</script>

</body>
</html>
