<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Адмінка</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #121212;
    color: #f2f2f2;
    font-family: Arial, sans-serif;
}

.container {
    width: min(900px, calc(100% - 24px));
    margin: 30px auto;
}

h1, h2, h3 {
    margin-top: 0;
}

.card {
    background: #1d1d1d;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
}

.login-card {
    max-width: 420px;
    margin: 80px auto;
}

label {
    display: block;
    margin: 14px 0 7px;
    color: #cfcfcf;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid #383838;
    border-radius: 10px;
    background: #252525;
    color: #fff;
    font-size: 15px;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #666;
}

input[type="number"] {
    appearance: textfield;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
    appearance: none;
    margin: 0;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 11px 15px;
    background: #303030;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #3a3a3a;
}

.primary {
    background: #f2f2f2;
    color: #111;
}

.primary:hover {
    background: #dcdcdc;
}

.danger {
    background: #552525;
}

.danger:hover {
    background: #693030;
}

.secondary {
    background: #292929;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.topbar h1 {
    margin: 0;
}

.topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.schedule-button {
    background: #252525;
    color: #bbb;
}

.schedule-button:hover {
    background: #303030;
    color: #fff;
}

.menu-button {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #252525;
    padding: 16px;
    font-size: 16px;
    text-align: left;
}

.form-content {
    display: none;
    padding-top: 18px;
}

.form-content.open {
    display: block;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.row-three {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.points-control {
    display: flex;
    align-items: center;
    width: 100%;
}

.points-control button {
    width: 45px;
    height: 45px;
    padding: 0;
    font-size: 20px;
    border-radius: 10px;
}

.points-control input {
    text-align: center;
    margin: 0 7px;
}

.type-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.type-button {
    background: #252525;
    border: 1px solid #383838;
}

.type-button.active {
    background: #e8e8e8;
    color: #111;
}

.day-buttons,
.week-buttons {
    display: grid;
    gap: 8px;
}

.day-buttons {
    grid-template-columns: repeat(5, 1fr);
}

.week-buttons {
    grid-template-columns: 1fr 1fr;
}

.day-button,
.week-button {
    background: #252525;
    border: 1px solid #383838;
}

.day-button.active,
.week-button.active {
    background: #eeeeee;
    color: #111;
}

.lesson-card {
    background: #242424;
    border-radius: 14px;
    padding: 17px;
    margin-top: 12px;
}

.lesson-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.lesson-number {
    font-size: 18px;
    font-weight: bold;
}

.lesson-time {
    color: #999;
    font-size: 14px;
}

.lesson-card .actions {
    margin-top: 14px;
}

.item {
    background: #242424;
    border-radius: 14px;
    padding: 17px;
    margin-top: 12px;
}

.item-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
}

.item-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}

.item-meta {
    color: #aaa;
    font-size: 14px;
    line-height: 1.5;
}

.item-description {
    margin-top: 12px;
    color: #ddd;
    white-space: pre-wrap;
}

.item-info {
    margin-top: 10px;
    color: #bbb;
}

.item-link {
    margin-top: 10px;
}

.item-link a {
    color: #9fc5ff;
    text-decoration: none;
}

.edit-form {
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #383838;
}

.edit-form.open {
    display: block;
}

.small {
    font-size: 13px;
    color: #999;
}

.empty {
    color: #999;
    padding: 15px 0;
}

.status {
    margin-top: 12px;
    color: #bbb;
}

.error {
    color: #ff8e8e;
}

.success {
    color: #9ee69e;
}

.hidden {
    display: none !important;
}

.badge {
    display: inline-block;
    background: #333;
    border-radius: 7px;
    padding: 4px 8px;
    font-size: 12px;
    color: #ddd;
}

.schedule-editor {
    display: none;
}

.schedule-editor.open {
    display: block;
}

.schedule-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.schedule-top h2 {
    margin: 0;
}

.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
}

@media (max-width: 650px) {
    .row,
    .row-three,
    .settings-grid {
        grid-template-columns: 1fr;
    }

    .day-buttons {
        grid-template-columns: repeat(3, 1fr);
    }

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .topbar-actions {
        width: 100%;
    }

    .item-header,
    .lesson-header,
    .schedule-top {
        flex-direction: column;
        align-items: flex-start;
    }

    .container {
        margin-top: 15px;
    }
}
</style>
</head>

<body>

<div id="loginView" class="container">
    <div class="card login-card">
        <h1>Вхід</h1>

        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email">

        <label for="loginPassword">Пароль</label>
        <input id="loginPassword" type="password" autocomplete="current-password">

        <div class="actions">
            <button class="primary" onclick="login()">Увійти</button>
        </div>

        <div id="loginStatus" class="status"></div>
    </div>
</div>


<div id="adminView" class="container hidden">

    <div class="topbar">
        <h1 id="pageTitle">Адмінка</h1>

        <div class="topbar-actions">
            <button id="scheduleButton" class="schedule-button" onclick="openScheduleEditor()">Розклад</button>
            <button id="backAdminButton" class="schedule-button hidden" onclick="closeScheduleEditor()">Адмінка</button>
            <button onclick="logout()">Вийти</button>
        </div>
    </div>


    <div id="adminContent">

        <div class="card">

            <button class="menu-button" onclick="toggleMenu('taskForm')">
                <span>Додати домашнє завдання</span>
                <span>+</span>
            </button>

            <div id="taskForm" class="form-content">

                <label for="taskSubject">Предмет</label>
                <select id="taskSubject">
                    <option value="">Предмет не вибрано</option>
                </select>

                <label for="taskTitle">Назва</label>
                <input id="taskTitle" type="text" placeholder="Необов'язково">

                <label for="taskDescription">Опис</label>
                <textarea id="taskDescription" placeholder="Додатковий опис"></textarea>

                <div class="row">

                    <div>
                        <label for="taskDeadline">Дедлайн</label>
                        <input id="taskDeadline" type="date">
                        <div class="small">Можна залишити порожнім.</div>
                    </div>

                    <div>
                        <label>Бали</label>

                        <div class="points-control">
                            <button type="button" onclick="changePoints(-1)">−</button>

        </div>


        <div class="card">

            <div id="eventForm" class="form-content">

                <label>Тип події</label>

                <div id="eventTypeButtons" class="type-buttons">
                    <button type="button" class="type-button active" data-type="" onclick="selectEventType(this)">Без типу</button>
                    <button type="button" class="type-button" data-type="Семінар" onclick="selectEventType(this)">Семінар</button>
                    <button type="button" class="type-button" data-type="Іспит" onclick="selectEventType(this)">Іспит</button>
                    <button type="button" class="type-button" data-type="Залік" onclick="selectEventType(this)">Залік</button>
                    <button type="button" class="type-button" data-type="Консультація" onclick="selectEventType(this)">Консультація</button>
                    <button type="button" class="type-button" data-type="Лекція" onclick="selectEventType(this)">Лекція</button>
                    <button type="button" class="type-button" data-type="Особисте" onclick="selectEventType(this)">Особисте</button>
                    <button type="button" class="type-button" data-type="Інше" onclick="selectEventType(this)">Інше</button>
                </div>

                <label for="eventSubject">Предмет</label>
                <select id="eventSubject">
                    <option value="">Без предмета</option>
                </select>

                <label for="eventTitle">Назва</label>
                <input id="eventTitle" type="text" placeholder="Необов'язково">

                <label for="eventDescription">Опис</label>
                <textarea id="eventDescription" placeholder="Додатковий опис"></textarea>

                <div class="row">

                    <div>
                        <label for="eventStart">Початок</label>
                        <input id="eventStart" type="date">
                        <div class="small">Можна вказати лише день.</div>
                    </div>

                    <div>
                        <label for="eventEnd">Кінець</label>
                        <input id="eventEnd" type="date">
                        <div class="small">Можна залишити порожнім.</div>
                    </div>

                </div>

                <label for="eventInfo">Додаткова інформація</label>
                <input id="eventInfo" type="text" placeholder="Наприклад: аудиторія 204">

                <label for="eventLink">Посилання</label>
                <textarea id="eventLink" rows="3" placeholder="Назва/https://... або https://... · кожне посилання з нового рядка"></textarea>

                <div class="actions">
                    <button class="primary" onclick="addEvent()">Додати</button>
                    <button onclick="clearEventForm()">Очистити</button>

        </div>


        <div class="card">
            <h2>Домашні завдання</h2>
            <div id="tasksList"></div>
        </div>


        <div class="card">
            <h2>Події</h2>
            <div id="eventsList"></div>
        </div>

    </div>


    <div id="scheduleEditor" class="schedule-editor">

        <div class="card">

            <div class="schedule-top">

                    <div class="small">Розклад зберігається у Supabase і автоматично використовується index.html.</div>
                </div>

                <button onclick="closeScheduleEditor()">← Адмінка</button>
            </div>

            <h3>Налаштування семестру</h3>

            <div class="settings-grid">

                <div>
                    <label for="scheduleStart">Початок розкладу</label>
                    <input id="scheduleStart" type="date">
                </div>

                <div>
                    <label for="scheduleEnd">Кінець розкладу</label>
                    <input id="scheduleEnd" type="date">
                </div>

                <div>
                    <label for="upperWeekStart">Початок верхнього тижня</label>
                    <input id="upperWeekStart" type="date">
                </div>

            </div>

            <div class="actions">
                <button class="primary" onclick="saveScheduleSettings()">Зберегти налаштування</button>
            </div>

            <div id="scheduleSettingsStatus" class="status"></div>

        </div>


        <div class="card">

            <h3>Тиждень</h3>

            <div class="week-buttons">
                <button id="weekUpperButton" class="week-button active" onclick="selectScheduleWeek('upper')">
                    Верхній тиждень
                </button>

                <button id="weekLowerButton" class="week-button" onclick="selectScheduleWeek('lower')">
                    Нижній тиждень
                </button>
            </div>

        </div>


        <div class="card">

            <h3>День</h3>

            <div class="day-buttons">
                <button id="day-Понеділок" class="day-button active" onclick="selectScheduleDay('Понеділок')">Пн</button>
                <button id="day-Вівторок" class="day-button" onclick="selectScheduleDay('Вівторок')">Вт</button>
                <button id="day-Середа" class="day-button" onclick="selectScheduleDay('Середа')">Ср</button>
                <button id="day-Четвер" class="day-button" onclick="selectScheduleDay('Четвер')">Чт</button>
                <button id="day-П’ятниця" class="day-button" onclick="selectScheduleDay('П’ятниця')">Пт</button>
            </div>

        </div>


        <div class="card">

            <h3 id="scheduleDayTitle">Понеділок · Верхній тиждень</h3>

            <div id="lessonsEditor"></div>

            <div id="scheduleEditorStatus" class="status"></div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://jnhoomjnsixcyhacqmgy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5LLHZS7S1FD3lHlZM_ox2g_Ggv8wY32";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


let subjectsCache = [];
let tasksCache = [];
let eventsCache = [];
let selectedEventType = "";

let scheduleCache = [];
let semesterSettings = null;
let selectedScheduleDay = "Понеділок";
let selectedScheduleWeek = "upper";

let scheduleSaveMessage = "";
let scheduleSaveMessageType = "";


const lessonTimes = {
    1: ["08:20", "09:40"],
    2: ["09:50", "11:10"],
    3: ["11:30", "12:50"],
    4: ["13:00", "14:20"]
};


document.addEventListener("DOMContentLoaded", async () => {

    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        showAdmin();
        await loadAll();
    } else {
        showLogin();
    }

    supabaseClient.auth.onAuthStateChange(async (event, session) => {

        if (session) {
            showAdmin();
            await loadAll();
        } else {
            showLogin();
        }

    });

});


function showLogin() {
    document.getElementById("loginView").classList.remove("hidden");
    document.getElementById("adminView").classList.add("hidden");
}


function showAdmin() {
    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("adminView").classList.remove("hidden");
}


async function login() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const status = document.getElementById("loginStatus");

    status.textContent = "";

    if (!email || !password) {
        status.textContent = "Введи email і пароль.";
        status.className = "status error";
        return;
    }

    const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        status.textContent = error.message;
        status.className = "status error";
        return;
    }

    status.textContent = "Вхід виконано.";
    status.className = "status success";
}


async function logout() {
    await supabaseClient.auth.signOut();
}


async function loadAll() {
    await loadSubjects();
    await loadTasks();
    await loadEvents();
    await loadSchedule();
}


async function loadSubjects() {

    const { data, error } = await supabaseClient
        .from("subjects")
        .select("id, name")
        .order("name");

    if (error) {
        console.error(error);
        return;
    }

    subjectsCache = data || [];

    fillSubjectSelect("taskSubject", "Предмет не вибрано");
    fillSubjectSelect("eventSubject", "Без предмета");
}


function fillSubjectSelect(id, emptyText) {

    const select = document.getElementById(id);

    select.innerHTML = "";

    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = emptyText;

    select.appendChild(emptyOption);

    subjectsCache.forEach(subject => {

        const option = document.createElement("option");

        option.value = subject.id;
        option.textContent = subject.name;

        select.appendChild(option);

    });

}


async function loadTasks() {

    const { data, error } = await supabaseClient
        .from("tasks")
        .select(`
            id,
            subject_id,
            title,
            description,
            deadline,
            points,
            duration_minutes,
            material,
            created_at,
            subjects (
                name
            )
        `)
        .order("deadline", { ascending: true, nullsFirst: false })
        .order("created_at", { ascending: false });

    if (error) {

        console.error(error);

        document.getElementById("tasksList").innerHTML =
            `<div class="error">Помилка завантаження: ${escapeHtml(error.message)}</div>`;

        return;
    }

    tasksCache = data || [];

    renderTasks();

}


async function loadEvents() {

    const { data, error } = await supabaseClient
        .from("events")
        .select(`
            id,
            title,
            description,
            start_at,
            end_at,
            link,
            info,
            event_type,
            subject_id,
            created_at,
            subjects (
                name
            )
        `)
        .order("start_at", { ascending: true });

    if (error) {

        console.error(error);

        document.getElementById("eventsList").innerHTML =
            `<div class="error">Помилка завантаження: ${escapeHtml(error.message)}</div>`;

        return;
    }

    eventsCache = data || [];

    renderEvents();

}


async function loadSchedule() {

    const settingsResult = await supabaseClient
        .from("schedule_settings")
        .select("*")
        .eq("id", 1)
        .maybeSingle();

    if (settingsResult.error) {

        console.error(settingsResult.error);

        document.getElementById("scheduleSettingsStatus").textContent =
            settingsResult.error.message;

        document.getElementById("scheduleSettingsStatus").className =
            "status error";

    } else {

        semesterSettings = settingsResult.data || null;

        if (semesterSettings) {

            document.getElementById("scheduleStart").value =
                semesterSettings.schedule_start || "";

            document.getElementById("scheduleEnd").value =
                semesterSettings.schedule_end || "";

            document.getElementById("upperWeekStart").value =
                semesterSettings.upper_week_start || "";

        }

    }


    const scheduleResult = await supabaseClient
        .from("schedule")
        .select(`
            id,
            day_of_week,
            week_type,
            lesson_number,
            subject_id,
            teacher,
            room,
            links,
            subjects (
                name
            )
        `)
        .order("lesson_number", { ascending: true });


    if (scheduleResult.error) {

        console.error(scheduleResult.error);

        document.getElementById("scheduleEditorStatus").textContent =
            scheduleResult.error.message;

        document.getElementById("scheduleEditorStatus").className =
            "status error";

        return;
    }

    scheduleCache = scheduleResult.data || [];

    renderScheduleEditor();

}


function parseAdminLinks(value) {

    if (!value) return [];

    return String(value)
        .split(/\r?\n/)
        .map(item => item.trim())
        .filter(Boolean)
        .map(item => {

            if (item.startsWith("http://") || item.startsWith("https://")) {
                return {
                    name: "Матеріал",
                    url: item
                };
            }

            const separatorIndex = item.indexOf("/");

            if (separatorIndex > 0) {
                const name = item.slice(0, separatorIndex).trim();
                const url = item.slice(separatorIndex + 1).trim();

                if (name && (url.startsWith("http://") || url.startsWith("https://"))) {
                    return {
                        name,
                        url
                    };
                }
            }

            return {
                name: "Матеріал",
                url: item
            };
        });
}

function renderAdminLinks(value, defaultName) {

    const links = parseAdminLinks(value);

    return links.map(link => `
        <div class="item-link">
            <a href="${escapeAttribute(link.url)}" target="_blank" rel="noopener noreferrer">
                ${escapeHtml(link.name || defaultName)}
            </a>
        </div>
    `).join("");
}

function renderTasks() {

    const container = document.getElementById("tasksList");

    if (!tasksCache.length) {

        container.innerHTML =
            `<div class="empty">Домашніх завдань поки немає.</div>`;

        return;
    }

    container.innerHTML = tasksCache.map(task => {

        const subject =
            task.subjects?.name || "Предмет не вказано";

        let duration = "";

        if (task.duration_minutes) {

            if (task.duration_minutes % 60 === 0) {
                duration = `${task.duration_minutes / 60} год.`;
            } else {
                duration = `${task.duration_minutes} хв.`;
            }

        }

        const deadline = task.deadline

function getScheduleLinks(value) {

    if (!value) {
        return [];
    }

    if (Array.isArray(value)) {
        return value;
    }

    if (typeof value === "string") {

        try {
            return JSON.parse(value);
        } catch {
            return [];
        }

    }

    return [];

}


function parseScheduleLinks(text) {

    if (!text.trim()) {
        return [];
    }

    return text
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {

            if (
                line.startsWith("http://") ||
                line.startsWith("https://")
            ) {
                return {
                    title: "",
                    url: line
                };
            }

            const separatorIndex = line.indexOf("/");

            if (separatorIndex === -1) {
                return null;
            }

            const title =
                line.slice(0, separatorIndex).trim();

            const url =
                line.slice(separatorIndex + 1).trim();

            if (!url) {
                return null;
            }

            return {
                title,
                url
            };

        })
        .filter(Boolean);

}


async function saveScheduleLesson(lessonNumber) {

    const subjectId =
        document.getElementById(`schedule-subject-${lessonNumber}`).value;

    const teacher =
        document.getElementById(`schedule-teacher-${lessonNumber}`).value.trim();

    const room =
        document.getElementById(`schedule-room-${lessonNumber}`).value.trim();

    const linksText =
        document.getElementById(`schedule-links-${lessonNumber}`).value;

    const status =
        document.getElementById("scheduleEditorStatus");

    status.textContent = "";

    scheduleSaveMessage = "";
    scheduleSaveMessageType = "";

    if (!subjectId) {

        await deleteScheduleLesson(lessonNumber);

        return;
    }

    const links = parseScheduleLinks(linksText);

    const existing = scheduleCache.find(item =>
        item.day_of_week === selectedScheduleDay &&
        item.week_type === selectedScheduleWeek &&
        Number(item.lesson_number) === lessonNumber
    );

    const payload = {
        day_of_week: selectedScheduleDay,
        week_type: selectedScheduleWeek,
        lesson_number: lessonNumber,
        subject_id: Number(subjectId),
        teacher: teacher || null,
        room: room || null,
        links: links.length ? links : null
    };

    let result;

    if (existing) {

        result = await supabaseClient
            .from("schedule")
            .update(payload)
            .eq("id", existing.id);

    } else {

        result = await supabaseClient
            .from("schedule")
            .insert(payload);

    }

    if (result.error) {

        status.textContent = result.error.message;
        status.className = "status error";

        return;
    }

    scheduleSaveMessage = "Збережено";
    scheduleSaveMessageType = "success";

    await loadSchedule();

}


async function deleteScheduleLesson(lessonNumber) {

    const existing = scheduleCache.find(item =>
        item.day_of_week === selectedScheduleDay &&
        item.week_type === selectedScheduleWeek &&
        Number(item.lesson_number) === lessonNumber
    );

    if (!existing) {

        renderScheduleEditor();

        return;
    }

    const status =
        document.getElementById("scheduleEditorStatus");

    const { error } = await supabaseClient
        .from("schedule")
        .delete()
        .eq("id", existing.id);

    if (error) {

        status.textContent = error.message;
        status.className = "status error";

        return;
    }

    status.textContent = `${lessonNumber} пару очищено.`;
    status.className = "status success";

    await loadSchedule();

}

function durationToMinutes(value, unit) {

    const number = Number(value);

    if (!number || number <= 0) {
        return null;
    }

    if (unit === "hours") {
        return Math.round(number * 60);
    }

    return Math.round(number);

}

        ).value.trim();

    const description =
        document.getElementById(
            `edit-event-description-${id}`
        ).value.trim();

    const start =
        document.getElementById(
            `edit-event-start-${id}`
        ).value;

    const end =
        document.getElementById(
            `edit-event-end-${id}`
        ).value;

    const info =
        document.getElementById(
            `edit-event-info-${id}`
        ).value.trim();

    const link =
        document.getElementById(
            `edit-event-link-${id}`
        ).value.trim();

    const status =
        document.getElementById(
            `edit-event-status-${id}`
        );

    if (!start) {

        status.textContent =
            "Вкажи день події.";

        status.className =
            "status error";

        return;
    }

    if (end && new Date(end) < new Date(start)) {

        status.textContent =
            "Кінець не може бути раніше початку.";

        status.className =
            "status error";

        return;
    }

    const { error } = await supabaseClient
        .from("events")
        .update({

            title:
                title || null,

            description:
                description || null,

            start_at:
                new Date(start).toISOString(),

            end_at:
                end
                    ? new Date(end).toISOString()
                    : null,

            link:
                link || null,

            info:
                info || null,

            event_type:
                type || null,

            subject_id:
                subjectId
                    ? Number(subjectId)
                    : null

        })
        .eq("id", id);

    if (error) {

        status.textContent =
            error.message;

        status.className =
            "status error";

        return;
    }

    await loadEvents();

}


async function deleteTask(id) {

    const task =
        tasksCache.find(item => item.id === id);

    if (!task) {
        return;
    }

    if (!confirm(
        `Видалити завдання «${task.title}»?`
    )) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("tasks")
            .delete()
            .eq("id", id);

    if (error) {

        alert(error.message);

        return;
    }

    await loadTasks();

}


async function deleteEvent(id) {

    const event =
        eventsCache.find(item => item.id === id);

    if (!event) {
        return;
    }

    const title =
        event.title ||
        event.subjects?.name ||
        "подію";

    if (!confirm(
        `Видалити подію «${title}»?`
    )) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("events")
            .delete()
            .eq("id", id);

    if (error) {

        alert(error.message);

        return;
    }

    await loadEvents();

}

function formatDate(date) {

    if (!date) {
        return "";
    }

    const parts =
        date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return `${parts[2]}.${parts[1]}.${parts[0]}`;

}


function formatDateOnly(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    return date.toLocaleDateString(
        "uk-UA"
    );

}


function toDateLocal(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    const pad =
        number =>
            String(number).padStart(2, "0");

    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;

}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {
    return escapeHtml(value);
}
