<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Розклад групи</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #121212;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: min(94%, 850px);
    margin: 20px auto 50px;
}

.header {
    background: #1d1d1d;
    border: 1px solid #2d2d2d;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 20px;
}

.title {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 10px;
}

.today {
    font-size: 18px;
    color: #aaa;
    margin-bottom: 20px;
}

.week-box {
    background: #252525;
    border-radius: 15px;
    padding: 18px;
}

.next-label {
    color: #999;
    font-size: 15px;
    margin-bottom: 6px;
}

.next-subject {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 8px;
}

.next-time {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.next-details {
    color: #aaa;
    line-height: 1.5;
}

.next-after {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #3a3a3a;
    color: #888;
    font-size: 14px;
}

.join-link {
    display: inline-block;
    margin-top: 10px;
    margin-right: 6px;
    padding: 8px 13px;
    border: 1px solid #555;
    border-radius: 9px;
    color: #ddd;
    text-decoration: none;
    font-size: 14px;
}

.join-link:hover {
    background: #303030;
}

.desktop-button {
    display: block;
    width: 100%;
    margin-top: 25px;
    padding: 15px 20px;
    background: #1d1d1d;
    border: 1px solid #363636;
    border-radius: 14px;
    color: #f2f2f2;
    text-align: center;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    transition: background 0.2s;
}

.desktop-button:hover {
    background: #292929;
}

.day-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 25px;
}

.day-button {
    background: #1d1d1d;
    color: #ddd;
    border: 1px solid #363636;
    border-radius: 12px;
    padding: 13px 8px;
    cursor: pointer;
    font-size: 15px;
}

.day-button:hover {
    background: #292929;
}

.day-button.active {
    background: #eeeeee;
    color: #111;
    font-weight: bold;
}

.day-title {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 14px;
}

.lesson {
    background: #1d1d1d;
    border: 1px solid #2d2d2d;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 10px;
}

.lesson-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 9px;
}

.lesson-number {
    color: #aaa;
    font-weight: bold;
}

.lesson-time {
    font-weight: bold;
}

.subject {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 9px;
}

.details {
    color: #aaa;
    line-height: 1.55;
}

.break {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin: 9px 0 13px;
}

.message {
    background: #1d1d1d;
    border: 1px solid #2d2d2d;
    border-radius: 16px;
    padding: 25px 20px;
    text-align: center;
    color: #aaa;
}

.message strong {
    display: block;
    color: #f2f2f2;
    font-size: 24px;
    margin-bottom: 8px;
}

@media (max-width: 600px) {

    .day-buttons {
        grid-template-columns: repeat(3, 1fr);
    }

    .lesson-top {
        flex-direction: column;
        gap: 5px;
    }

    .title {
        font-size: 27px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="title">
            Розклад групи
        </div>

        <div class="today" id="today"></div>

        <div class="week-box" id="nextBox"></div>

    </div>

    <div class="day-buttons">

        <button class="day-button" onclick="selectDay('Понеділок')">
            Пн
        </button>

        <button class="day-button" onclick="selectDay('Вівторок')">
            Вт
        </button>

        <button class="day-button" onclick="selectDay('Середа')">
            Ср
        </button>

        <button class="day-button" onclick="selectDay('Четвер')">
            Чт
        </button>

        <button class="day-button" onclick="selectDay('П’ятниця')">
            Пт
        </button>

    </div>

    <div id="schedule"></div>

    <a class="desktop-button" href="prostor.html">
        Робочий стіл
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://jnhoomjnsixcyhacqmgy.supabase.co";
const SUPABASE_KEY = "sb_publishable_5LLHZS7S1FD3lHlZM_ox2g_Ggv8wY32";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const onlineLinksEnabled = true;

const lessonTimes = [
    ["08:20", "09:40"],
    ["09:50", "11:10"],
    ["11:30", "12:50"],
    ["13:00", "14:20"]
];

const dayNames = [
    "неділя",
    "понеділок",
    "вівторок",
    "середа",
    "четвер",
    "п’ятниця",
    "субота"
];

const scheduleDayNames = [
    "Понеділок",
    "Вівторок",
    "Середа",
    "Четвер",
    "П’ятниця"
];

const monthNames = [
    "січня",
    "лютого",
    "березня",
    "квітня",
    "травня",
    "червня",
    "липня",
    "серпня",
    "вересня",
    "жовтня",
    "листопада",
    "грудня"
];

let selectedDay = null;
let scheduleData = [];
let semesterSettings = null;

function formatDate(date) {
    return `${dayNames[date.getDay()]}, ${date.getDate()} ${monthNames[date.getMonth()]} ${date.getFullYear()} року`;
}

function parseDate(value) {
    if (!value) {
        return null;
    }

    const parts = String(value).split("-");

    if (parts.length !== 3) {
        return null;
    }

    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );
}

function dateOnly(date) {
    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );
}

function mondayOfWeek(date) {
    const d = dateOnly(date);
    const day = d.getDay();

    const difference =
        day === 0
            ? -6
            : 1 - day;

    d.setDate(
        d.getDate() + difference
    );

    return d;
}

function getBaseWeekInfo(date) {

    if (!semesterSettings) {
        return {
            number: 0,
            type: "upper"
        };
    }

    const currentMonday =
        mondayOfWeek(date);

    const upperWeekStart =
        parseDate(
            semesterSettings.upper_week_start
        );

    if (!upperWeekStart) {
        return {
            number: 0,
            type: "upper"
        };
    }

    const firstUpperMonday =
        mondayOfWeek(upperWeekStart);

    const difference =
        Math.round(
            (currentMonday - firstUpperMonday) /
            (1000 * 60 * 60 * 24)
        );

    const weekNumber =
        Math.floor(difference / 7);

    return {
        number: weekNumber + 1,
        type:
            weekNumber % 2 === 0
                ? "upper"
                : "lower"
    };
}

function getWeekInfo(date) {

    const baseWeekInfo =
        getBaseWeekInfo(date);

    const day =
        date.getDay();

    if (day === 6 || day === 0) {

        return {
            number:
                baseWeekInfo.number + 1,

            type:
                baseWeekInfo.type === "upper"
                    ? "lower"
                    : "upper"
        };
    }

    if (day === 5) {

        const lastFridayLessonStart =
            getLastFridayLessonStart(
                baseWeekInfo
            );

        if (lastFridayLessonStart !== null) {

            const currentMinutes =
                date.getHours() * 60 +
                date.getMinutes();

            if (
                currentMinutes >=
                lastFridayLessonStart
            ) {

                return {
                    number:
                        baseWeekInfo.number + 1,

                    type:
                        baseWeekInfo.type === "upper"
                            ? "lower"
                            : "upper"
                };
            }
        }
    }

    return baseWeekInfo;
}

function getLastFridayLessonStart(weekInfo) {

    const lessons =
        scheduleData.filter(item =>
            item.day_of_week === "П’ятниця" &&
            item.week_type === weekInfo.type &&
            item.subject &&
            String(item.subject).trim() !== ""
        );

    if (!lessons.length) {
        return null;
    }

    const lessonNumbers =
        lessons
            .map(item => Number(item.lesson_number))
            .filter(number =>
                number >= 1 &&
                number <= 4
            )
            .sort((a, b) => a - b);

    if (!lessonNumbers.length) {
        return null;
    }

    const lastLessonNumber =
        lessonNumbers[
            lessonNumbers.length - 1
        ];

    const lastTime =
        lessonTimes[
            lastLessonNumber - 1
        ];

    if (!lastTime) {
        return null;
    }

    return timeToMinutes(
        lastTime[0]
    );
}

function getScheduleForDate(date) {

    const day =
        date.getDay();

    if (
        day < 1 ||
        day > 5
    ) {
        return null;
    }

    const weekInfo =
        getWeekInfo(date);

    const dayName =
        scheduleDayNames[day - 1];

    const lessons =
        scheduleData
            .filter(item =>
                item.day_of_week === dayName &&
                item.week_type === weekInfo.type
            )
            .sort(
                (a, b) =>
                    Number(a.lesson_number) -
                    Number(b.lesson_number)
            );

    const uniqueLessons = [];
    const usedLessonNumbers = new Set();

    lessons.forEach(lesson => {

        const lessonNumber =
            Number(lesson.lesson_number);

        if (
            lessonNumber < 1 ||
            lessonNumber > 4
        ) {
            return;
        }

        if (
            usedLessonNumbers.has(
                lessonNumber
            )
        ) {
            return;
        }

        usedLessonNumbers.add(
            lessonNumber
        );

        uniqueLessons.push(
            lesson
        );
    });

    return {
        dayName,
        weekInfo,
        lessons: uniqueLessons
    };
}

function getScheduleForSelectedDay() {

    if (!selectedDay) {
        return null;
    }

    const today =
        new Date();

    const weekInfo =
        getWeekInfo(today);

    const lessons =
        scheduleData
            .filter(item =>
                item.day_of_week === selectedDay &&
                item.week_type === weekInfo.type
            )
            .sort(
                (a, b) =>
                    Number(a.lesson_number) -
                    Number(b.lesson_number)
            );

    const uniqueLessons = [];
    const usedLessonNumbers = new Set();

    lessons.forEach(lesson => {

        const lessonNumber =
            Number(lesson.lesson_number);

        if (
            lessonNumber < 1 ||
            lessonNumber > 4
        ) {
            return;
        }

        if (
            usedLessonNumbers.has(
                lessonNumber
            )
        ) {
            return;
        }

        usedLessonNumbers.add(
            lessonNumber
        );

        uniqueLessons.push(
            lesson
        );
    });

    return {
        dayName: selectedDay,
        weekInfo,
        lessons: uniqueLessons
    };
}

function getFilledLessons(lessons) {

    if (!lessons) {
        return [];
    }

    return lessons.filter(lesson => {

        if (!lesson) {
            return false;
        }

        return (
            lesson.subject &&
            String(lesson.subject).trim() !== ""
        );
    });
}

function createLesson(
    date,
    dayData,
    lesson
) {

    const number =
        Number(lesson.lesson_number);

    const time =
        lessonTimes[number - 1];

    if (!time) {
        return null;
    }

    return {
        date: new Date(date),

        dayName:
            dayData.dayName,

        weekInfo:
            dayData.weekInfo,

        number,

        data:
            lesson,

        time
    };
}

function timeToMinutes(time) {

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );
}

function escapeHTML(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getLinks(data) {

    if (!data || !data.links) {
        return [];
    }

    if (Array.isArray(data.links)) {
        return data.links.filter(link =>
            link &&
            link.url
        );
    }

    if (typeof data.links === "string") {

        try {

            const parsed =
                JSON.parse(data.links);

            if (Array.isArray(parsed)) {
                return parsed.filter(link =>
                    link &&
                    link.url
                );
            }

        } catch (error) {
            return [];
        }
    }

    return [];
}

function renderLinks(data) {

    if (!onlineLinksEnabled) {
        return "";
    }

    const links =
        getLinks(data);

    if (!links.length) {
        return "";
    }

    if (links.length === 1) {

        return `
            <a
                class="join-link"
                href="${escapeHTML(links[0].url)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                Приєднатися
            </a>
        `;
    }

    return links.map((link, index) => {

        const title =
            link.title ||
            `Посилання ${index + 1}`;

        return `
            <a
                class="join-link"
                href="${escapeHTML(link.url)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ${escapeHTML(title)}
            </a>
        `;

    }).join("");
}

function getLessonDetails(data) {

    let html = "";

    if (data.room) {

        html += `
            Аудиторія:
            ${escapeHTML(data.room)}
        `;
    }

    if (data.teacher) {

        if (html) {
            html += "<br>";
        }

        html += `
            Викладач:
            ${escapeHTML(data.teacher)}
        `;
    }

    if (!html) {
        return "";
    }

    return `
        <div class="details">
            ${html}
        </div>
    `;
}

function getNextLesson() {

    if (!semesterSettings) {
        return null;
    }

    const semesterStart =
        parseDate(
            semesterSettings.schedule_start
        );

    const semesterEnd =
        parseDate(
            semesterSettings.schedule_end
        );

    if (!semesterStart || !semesterEnd) {
        return null;
    }

    const now =
        new Date();

    const currentDate =
        dateOnly(now);

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    const searchStart =
        currentDate < semesterStart
            ? new Date(semesterStart)
            : new Date(currentDate);

    for (
        let offset = 0;
        offset < 140;
        offset++
    ) {

        const date =
            new Date(searchStart);

        date.setDate(
            searchStart.getDate() + offset
        );

        if (date > semesterEnd) {
            return null;
        }

        const dayData =
            getScheduleForDate(date);

        if (!dayData) {
            continue;
        }

        const lessons =
            getFilledLessons(
                dayData.lessons
            );

        for (
            const lesson
            of lessons
        ) {

            const number =
                Number(lesson.lesson_number);

            const time =
                lessonTimes[number - 1];

            if (!time) {
                continue;
            }

            const start =
                timeToMinutes(
                    time[0]
                );

            const end =
                timeToMinutes(
                    time[1]
                );

            if (
                date.getTime() ===
                currentDate.getTime()
            ) {

                if (
                    currentMinutes >= end
                ) {
                    continue;
                }

                if (
                    currentMinutes >= start
                ) {
                    continue;
                }
            }

            return createLesson(
                date,
                dayData,
                lesson
            );
        }
    }

    return null;
}

function getSecondLesson(firstLesson) {

    if (!firstLesson) {
        return null;
    }

    const firstDate =
        new Date(firstLesson.date);

    const sameDay =
        getScheduleForDate(firstDate);

    if (sameDay) {

        const lessons =
            getFilledLessons(
                sameDay.lessons
            );

        const nextLessons =
            lessons.filter(
                lesson =>
                    Number(lesson.lesson_number) >
                    firstLesson.number
            );

        if (
            nextLessons.length > 0
        ) {

            return createLesson(
                firstDate,
                sameDay,
                nextLessons[0]
            );
        }
    }

    const semesterEnd =
        parseDate(
            semesterSettings.schedule_end
        );

    for (
        let offset = 1;
        offset < 140;
        offset++
    ) {

        const date =
            new Date(firstDate);

        date.setDate(
            firstDate.getDate() + offset
        );

        if (
            semesterEnd &&
            date > semesterEnd
        ) {
            return null;
        }

        const dayData =
            getScheduleForDate(date);

        if (!dayData) {
            continue;
        }

        const lessons =
            getFilledLessons(
                dayData.lessons
            );

        if (!lessons.length) {
            continue;
        }

        return createLesson(
            date,
            dayData,
            lessons[0]
        );
    }

    return null;
}

function getTodayDayName() {

    const day =
        new Date().getDay();

    if (day === 1) return "Понеділок";
    if (day === 2) return "Вівторок";
    if (day === 3) return "Середа";
    if (day === 4) return "Четвер";
    if (day === 5) return "П’ятниця";

    return "Понеділок";
}

function getShortDayName(day) {

    const names = {
        "Понеділок": "Пн",
        "Вівторок": "Вт",
        "Середа": "Ср",
        "Четвер": "Чт",
        "П’ятниця": "Пт"
    };

    return names[day];
}

function selectDay(day) {

    selectedDay =
        day;

    updateActiveButton();

    renderSchedule();
}

function updateActiveButton() {

    document
        .querySelectorAll(".day-button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

            if (
                button.textContent.trim() ===
                getShortDayName(
                    selectedDay
                )
            ) {

                button.classList.add(
                    "active"
                );
            }
        });
}

function updateHeader() {

    const today =
        new Date();

    document.getElementById(
        "today"
    ).textContent =
        formatDate(today);
}

function renderNextLesson() {

    const box =
        document.getElementById(
            "nextBox"
        );

    const nextLesson =
        getNextLesson();

    if (!nextLesson) {

        box.innerHTML = `
            <div class="next-label">
                Навчальний семестр завершено
            </div>
        `;

        return;
    }

    const secondLesson =
        getSecondLesson(
            nextLesson
        );

    box.innerHTML = `

        <div class="next-label">
            Наступна пара
        </div>

        <div class="next-subject">
            ${escapeHTML(
                nextLesson.data.subject
            )}
        </div>

        <div class="next-time">
            ${nextLesson.time[0]}
            –
            ${nextLesson.time[1]}
        </div>

        ${getLessonDetails(
            nextLesson.data
        )}

        ${renderLinks(
            nextLesson.data
        )}

        ${
            secondLesson
            ? `
                <div class="next-after">

                    ${escapeHTML(
                        secondLesson.data.subject
                    )}

                    ·

                    ${secondLesson.time[0]}
                    –
                    ${secondLesson.time[1]}

                </div>
            `
            : ""
        }

    `;
}

function renderSchedule() {

    const scheduleElement =
        document.getElementById(
            "schedule"
        );

    scheduleElement.innerHTML = "";

    if (!semesterSettings) {

        scheduleElement.innerHTML = `
            <div class="message">

                <strong>
                    Розклад недоступний
                </strong>

                Налаштування семестру ще не завантажено.

            </div>
        `;

        return;
    }

    const dayData =
        getScheduleForSelectedDay();

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "day-title";

    title.textContent =
        selectedDay;

    scheduleElement.appendChild(
        title
    );

    if (!dayData) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message";

        message.innerHTML = `
            <strong>
                Немає пар
            </strong>

            На цей день нічого не внесено.
        `;

        scheduleElement.appendChild(
            message
        );

        return;
    }

    const lessonNumbers =
        getFilledLessons(
            dayData.lessons
        );

    if (
        lessonNumbers.length === 0
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message";

        message.innerHTML = `
            <strong>
                Немає пар
            </strong>

            На цей день нічого не внесено.
        `;

        scheduleElement.appendChild(
            message
        );

        return;
    }

    lessonNumbers.forEach(
        (data, index) => {

            const lessonNumber =
                Number(data.lesson_number);

            const time =
                lessonTimes[
                    lessonNumber - 1
                ];

            if (!time) {
                return;
            }

            const lesson =
                document.createElement(
                    "div"
                );

            lesson.className =
                "lesson";

            lesson.innerHTML = `

                <div class="lesson-top">

                    <div class="lesson-number">
                        ${lessonNumber} пара
                    </div>

                    <div class="lesson-time">
                        ${time[0]} – ${time[1]}
                    </div>

                </div>

                <div class="subject">
                    ${escapeHTML(
                        data.subject
                    )}
                </div>

                ${getLessonDetails(
                    data
                )}

                ${renderLinks(
                    data
                )}

            `;

            scheduleElement.appendChild(
                lesson
            );

            if (
                index <
                lessonNumbers.length - 1
            ) {

                const nextNumber =
                    Number(
                        lessonNumbers[
                            index + 1
                        ].lesson_number
                    );

                const nextTime =
                    lessonTimes[
                        nextNumber - 1
                    ];

                if (!nextTime) {
                    return;
                }

                const breakMinutes =
                    timeToMinutes(
                        nextTime[0]
                    ) -
                    timeToMinutes(
                        time[1]
                    );

                if (
                    breakMinutes > 0
                ) {

                    const breakElement =
                        document.createElement(
                            "div"
                        );

                    breakElement.className =
                        "break";

                    breakElement.textContent =
                        `Перерва: ${breakMinutes} хв`;

                    scheduleElement.appendChild(
                        breakElement
                    );
                }
            }
        }
    );
}

async function loadSemesterSettings() {

    const {
        data,
        error
    } = await supabaseClient
        .from("schedule_settings")
        .select("*")
        .eq("id", 1)
        .maybeSingle();

    if (error) {

        console.error(
            "Помилка завантаження налаштувань:",
            error
        );

        showError(
            "Не вдалося завантажити налаштування семестру."
        );

        return false;
    }

    if (!data) {

        showError(
            "Налаштування семестру ще не створено."
        );

        return false;
    }

    semesterSettings =
        data;

    return true;
}

async function loadSchedule() {

    const {
        data,
        error
    } = await supabaseClient
        .from("schedule")
        .select(`
            id,
            day_of_week,
            week_type,
            lesson_number,
            subject_id,
            teacher,
            room,
            links,
            subjects (
                name
            )
        `)
        .order(
            "lesson_number",
            {
                ascending: true
            }
        );

    if (error) {

        console.error(
            "Помилка завантаження розкладу:",
            error
        );

        showError(
            "Не вдалося завантажити розклад."
        );

        return false;
    }

    scheduleData =
        (data || []).map(item => {

            return {
                ...item,

                subject:
                    item.subjects?.name ||
                    ""
            };
        });

    return true;
}

function showError(message) {

    document.getElementById(
        "schedule"
    ).innerHTML = `

        <div class="message">

            <strong>
                Помилка
            </strong>

            ${escapeHTML(message)}

        </div>

    `;

    document.getElementById(
        "nextBox"
    ).innerHTML = `

        <div class="next-label">
            Розклад недоступний
        </div>

    `;
}

async function init() {

    const settingsLoaded =
        await loadSemesterSettings();

    if (!settingsLoaded) {
        return;
    }

    const scheduleLoaded =
        await loadSchedule();

    if (!scheduleLoaded) {
        return;
    }

    selectedDay =
        getTodayDayName();

    updateHeader();

    renderNextLesson();

    renderSchedule();

    updateActiveButton();
}

init();

setInterval(
    async () => {

        updateHeader();

        const settingsLoaded =
            await loadSemesterSettings();

        if (!settingsLoaded) {
            return;
        }

        const scheduleLoaded =
            await loadSchedule();

        if (!scheduleLoaded) {
            return;
        }

        renderNextLesson();

        renderSchedule();

    },
    30000
);

</script>
