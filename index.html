<title>Розклад групи</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #121212;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: min(94%, 850px);
    margin: 20px auto 50px;
}

.header {
    background: #1d1d1d;
    border: 1px solid #2d2d2d;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 20px;
}

.title {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 10px;
}

.today {
    font-size: 18px;
    color: #aaa;
    margin-bottom: 20px;
}

.week-box {
    background: #252525;
    border-radius: 15px;
    padding: 18px;
}

.next-label {
    color: #999;
    font-size: 15px;
    margin-bottom: 6px;
}

.next-subject {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 8px;
}

.next-time {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.next-details {
    color: #aaa;
    line-height: 1.5;
}

.next-after {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #3a3a3a;
    color: #888;
    font-size: 14px;
}

.day-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 25px;
}

.day-button {
    background: #1d1d1d;
    color: #ddd;
    border: 1px solid #363636;
    border-radius: 12px;
    padding: 13px 8px;
    cursor: pointer;
    font-size: 15px;
}

.day-button:hover {
    background: #292929;
}

.day-button.active {
    background: #eeeeee;
    color: #111;
    font-weight: bold;
}

.day-title {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 14px;
}

.lesson {
    background: #1d1d1d;
    border: 1px solid #2d2d2d;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 10px;
}

.lesson-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 9px;
}

.lesson-number {
    color: #aaa;
    font-weight: bold;
}

.lesson-time {
    font-weight: bold;
}

.subject {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 9px;
}

.details {
    color: #aaa;
    line-height: 1.55;
}

.break {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin: 9px 0 13px;
}

.message {
    background: #1d1d1d;
    border: 1px solid #2d2d2d;
    border-radius: 16px;
    padding: 25px 20px;
    text-align: center;
    color: #aaa;
}

.message strong {
    display: block;
    color: #f2f2f2;
    font-size: 24px;
    margin-bottom: 8px;
}

@media (max-width: 600px) {

    .day-buttons {
        grid-template-columns: repeat(3, 1fr);
    }

    .lesson-top {
        flex-direction: column;
        gap: 5px;
    }

    .title {
        font-size: 27px;
    }

}

</style>

const semesterStart = new Date(2026, 8, 1);
const semesterEnd = new Date(2027, 0, 1);

const dayNames = [
    "неділя",
    "понеділок",
    "вівторок",
    "середа",
    "четвер",
    "п’ятниця",
    "субота"
];

const scheduleDayNames = [
    "Понеділок",
    "Вівторок",
    "Середа",
    "Четвер",
    "П’ятниця"
];

const monthNames = [
    "січня",
    "лютого",
    "березня",
    "квітня",
    "травня",
    "червня",
    "липня",
    "серпня",
    "вересня",
    "жовтня",
    "листопада",
    "грудня"
];

let selectedDay = null;

function formatDate(date) {

    return `${dayNames[date.getDay()]}, ${date.getDate()} ${monthNames[date.getMonth()]} ${date.getFullYear()} року`;

}

function mondayOfWeek(date) {

    const d = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

    const day = d.getDay();

    const difference =
        day === 0
            ? -6
            : 1 - day;

    d.setDate(
        d.getDate() + difference
    );

    return d;

}

function getWeekInfo(date) {

    const currentMonday =
        mondayOfWeek(date);

    const firstMonday =
        mondayOfWeek(semesterStart);

    const difference =
        Math.round(
            (currentMonday - firstMonday) /
            (1000 * 60 * 60 * 24)
        );

    const weekNumber =
        Math.floor(difference / 7) + 1;

    return {

        number: weekNumber,

        type:
            weekNumber % 2 === 1
                ? "upper"
                : "lower"

    };

}

function timeToMinutes(time) {

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );

}

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function getScheduleForDate(date) {

    const day =
        date.getDay();

    if (
        day < 1 ||
        day > 5
    ) {
        return null;
    }

    const weekInfo =
        getWeekInfo(date);

    const dayName =
        scheduleDayNames[day - 1];

    const key =
        `${dayName}_${weekInfo.type}`;

    return {

        key: key,

        dayName: dayName,

        weekInfo: weekInfo,

        lessons: schedule[key] || {}

    };

}

function getFilledLessons(daySchedule) {

    if (!daySchedule) {
        return [];
    }

    return Object.keys(daySchedule)
        .map(Number)
        .sort((a, b) => a - b)
        .filter(number => {

            const lesson =
                daySchedule[number];

            return (
                lesson &&
                lesson.subject &&
                lesson.subject.trim() !== ""
            );

        });

}

function createLesson(
    date,
    dayData,
    number
) {

    const time =
        lessonTimes[number - 1];

    if (!time) {
        return null;
    }

    return {

        date: new Date(date),

        dayName:
            dayData.dayName,

        weekInfo:
            dayData.weekInfo,

        number:
            number,

        data:
            dayData.lessons[number],

        time:
            time

    };

}

function getNextLesson() {

    const now =
        new Date();

    const currentDate =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    for (
        let offset = 0;
        offset < 140;
        offset++
    ) {

        const date =
            new Date(currentDate);

        date.setDate(
            currentDate.getDate() + offset
        );

        if (
            date >= semesterEnd
        ) {
            return null;
        }

        const dayData =
            getScheduleForDate(date);

        if (!dayData) {
            continue;
        }

        const lessonNumbers =
            getFilledLessons(
                dayData.lessons
            );

        for (
            const number
            of lessonNumbers
        ) {

            const time =
                lessonTimes[number - 1];

            if (!time) {
                continue;
            }

            const start =
                timeToMinutes(time[0]);

            const end =
                timeToMinutes(time[1]);

            if (offset === 0) {

                if (
                    currentMinutes >= end
                ) {
                    continue;
                }

                if (
                    currentMinutes >= start
                ) {
                    continue;
                }

            }

            return createLesson(
                date,
                dayData,
                number
            );

        }

    }

    return null;

}

function getSecondLesson(
    firstLesson
) {

    if (!firstLesson) {
        return null;
    }

    const firstDate =
        new Date(firstLesson.date);

    const sameDay =
        getScheduleForDate(firstDate);

    if (sameDay) {

        const numbers =
            getFilledLessons(
                sameDay.lessons
            );

        const nextNumbers =
            numbers.filter(
                number =>
                    number > firstLesson.number
            );

        if (
            nextNumbers.length > 0
        ) {

            return createLesson(
                firstDate,
                sameDay,
                nextNumbers[0]
            );

        }

    }

    for (
        let offset = 1;
        offset < 140;
        offset++
    ) {

        const date =
            new Date(firstDate);

        date.setDate(
            firstDate.getDate() + offset
        );

        if (
            date >= semesterEnd
        ) {
            return null;
        }

        const dayData =
            getScheduleForDate(date);

        if (!dayData) {
            continue;
        }

        const numbers =
            getFilledLessons(
                dayData.lessons
            );

        if (
            numbers.length === 0
        ) {
            continue;
        }

        return createLesson(
            date,
            dayData,
            numbers[0]
        );

    }

    return null;

}

function getTodayDayName() {

    const day =
        new Date().getDay();

    if (day === 1) return "Понеділок";
    if (day === 2) return "Вівторок";
    if (day === 3) return "Середа";
    if (day === 4) return "Четвер";
    if (day === 5) return "П’ятниця";

    return "Понеділок";

}

function getShortDayName(day) {

    const names = {

        "Понеділок": "Пн",
        "Вівторок": "Вт",
        "Середа": "Ср",
        "Четвер": "Чт",
        "П’ятниця": "Пт"

    };

    return names[day];

}

function selectDay(day) {

    selectedDay =
        day;

    updateActiveButton();

    renderSchedule();

}

function updateActiveButton() {

    document
        .querySelectorAll(".day-button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

            if (
                button.textContent.trim() ===
                getShortDayName(
                    selectedDay
                )
            ) {

                button.classList.add(
                    "active"
                );

            }

        });

}

function updateHeader() {

    const today =
        new Date();

    document.getElementById(
        "today"
    ).textContent =
        formatDate(today);

}

function renderNextLesson() {

    const box =
        document.getElementById(
            "nextBox"
        );

    const nextLesson =
        getNextLesson();

    if (!nextLesson) {

        box.innerHTML = `
            <div class="next-label">
                Навчальний семестр завершено
            </div>
        `;

        return;

    }

    const secondLesson =
        getSecondLesson(
            nextLesson
        );

    box.innerHTML = `

        <div class="next-label">
            Наступна пара
        </div>

        <div class="next-subject">
            ${escapeHTML(
                nextLesson.data.subject
            )}
        </div>

        <div class="next-time">
            ${nextLesson.time[0]}
            –
            ${nextLesson.time[1]}
        </div>

        <div class="next-details">

            Аудиторія:
            ${escapeHTML(
                nextLesson.data.room
            )}

            <br>

            Викладач:
            ${escapeHTML(
                nextLesson.data.teacher
            )}

        </div>

        ${
            secondLesson
            ? `
                <div class="next-after">

                    ${escapeHTML(
                        secondLesson.data.subject
                    )}
                    ·
                    ${secondLesson.time[0]}
                    –
                    ${secondLesson.time[1]}

                </div>
            `
            : ""
        }

    `;

}

function renderSchedule() {

    const scheduleElement =
        document.getElementById(
            "schedule"
        );

    scheduleElement.innerHTML = "";

    const today =
        new Date();

    const weekInfo =
        getWeekInfo(today);

    const key =
        `${selectedDay}_${weekInfo.type}`;

    const daySchedule =
        schedule[key];

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "day-title";

    title.textContent =
        selectedDay;

    scheduleElement.appendChild(
        title
    );

    if (!daySchedule) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message";

        message.innerHTML = `

            <strong>
                Немає пар
            </strong>

            На цей день нічого не внесено.

        `;

        scheduleElement.appendChild(
            message
        );

        return;

    }

    const lessonNumbers =
        getFilledLessons(
            daySchedule
        );

    if (
        lessonNumbers.length === 0
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message";

        message.innerHTML = `

            <strong>
                Немає пар
            </strong>

            На цей день нічого не внесено.

        `;

        scheduleElement.appendChild(
            message
        );

        return;

    }

    lessonNumbers.forEach(
        (lessonNumber, index) => {

            const data =
                daySchedule[
                    lessonNumber
                ];

            const time =
                lessonTimes[
                    lessonNumber - 1
                ];

            if (!time) {
                return;
            }

            const lesson =
                document.createElement(
                    "div"
                );

            lesson.className =
                "lesson";

            lesson.innerHTML = `

                <div class="lesson-top">

                    <div class="lesson-number">
                        ${lessonNumber} пара
                    </div>

                    <div class="lesson-time">
                        ${time[0]} – ${time[1]}
                    </div>

                </div>

                <div class="subject">
                    ${escapeHTML(
                        data.subject
                    )}
                </div>

                <div class="details">

                    Аудиторія:
                    ${escapeHTML(
                        data.room
                    )}

                    <br>

                    Викладач:
                    ${escapeHTML(
                        data.teacher
                    )}

                </div>

            `;

            scheduleElement.appendChild(
                lesson
            );

            if (
                index <
                lessonNumbers.length - 1
            ) {

                const nextNumber =
                    lessonNumbers[
                        index + 1
                    ];

                const nextTime =
                    lessonTimes[
                        nextNumber - 1
                    ];

                if (!nextTime) {
                    return;
                }

                const breakMinutes =
                    timeToMinutes(
                        nextTime[0]
                    ) -
                    timeToMinutes(
                        time[1]
                    );

                if (
                    breakMinutes > 0
                ) {

                    const breakElement =
                        document.createElement(
                            "div"
                        );

                    breakElement.className =
                        "break";

                    breakElement.textContent =
                        `Перерва: ${breakMinutes} хв`;

                    scheduleElement.appendChild(
                        breakElement
                    );

                }

            }

        }
    );

}

selectedDay =
    getTodayDayName();

updateHeader();

renderNextLesson();

renderSchedule();

updateActiveButton();

setInterval(
    () => {

        updateHeader();
        renderNextLesson();

        if (
            selectedDay ===
            getTodayDayName()
        ) {

            renderSchedule();

        }

    },
    30000
);
